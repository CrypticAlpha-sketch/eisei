<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>第二種衛生管理者 ○×問題集</title>
<meta name="description" content="第二種衛生管理者試験の○×問題集。関係法令・労働衛生・労働生理の3科目。">
<meta name="theme-color" content="#FFFFFF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="衛生管理者○×">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --panel:#F4F6F6; --panel-2:#ECF0F0;
  --line:#E3E8E8; --line-strong:#CCD4D4;
  --ink:#1B2324; --muted:#636E6F; --faint:#9AA3A4;
  --accent:#1F6E64; --accent-ink:#FFFFFF; --accent-soft:#E4F1EE;
  --pen:#D33D2E; --pen-soft:#FCEBE8; --ng-bar:#E8897C;
  --c-law:#4A5B91; --c-hyg:#2F7468; --c-phy:#8A4E71;
  --gothic:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  --mincho:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;background:var(--bg)}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--gothic);font-size:16px;line-height:1.7;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;
}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

#app{max-width:480px;margin:0 auto;padding:0 20px;min-height:100%;display:flex;flex-direction:column}
body[data-view="quiz"] #app{height:100%}
.view{display:flex;flex-direction:column;flex:1;min-height:0}

/* ---------- ホーム ---------- */
.home-head{padding:40px 0 0}
h1{font-family:var(--mincho);font-weight:700;font-size:2rem;line-height:1.35;letter-spacing:.05em;margin:0}
.sub{margin:6px 0 0;font-size:1rem;color:var(--muted);letter-spacing:.1em;display:flex;align-items:center;gap:8px}
.sub svg{flex:none}
.summary{margin:28px 0 0;padding:18px 18px 16px;background:var(--panel);border-radius:18px}
.summary-line{margin:0 0 12px;font-size:.95rem;color:var(--muted)}
.summary-line b{color:var(--ink);font-size:1.55rem;font-weight:700;margin:0 .12em;font-variant-numeric:tabular-nums}
.meter{display:flex;height:6px;border-radius:999px;background:var(--panel-2);overflow:hidden}
.summary .meter{background:#fff}
.meter i{display:block;height:100%;transition:width .4s ease}
.meter .ok{background:var(--accent)}
.meter .ng{background:var(--ng-bar)}
.legend{display:flex;flex-wrap:wrap;gap:4px 18px;margin:10px 0 0;padding:0;list-style:none;font-size:.8rem;color:var(--muted)}
.legend li::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:1px;background:var(--sw)}
.legend b{font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums;margin-left:.3em}

.group{border:0;margin:26px 0 0;padding:0;min-width:0}
.group legend{font-size:.85rem;color:var(--muted);margin:0 0 10px;padding:0 2px;letter-spacing:.06em}
.cat-list{border:1px solid var(--line);border-radius:18px;overflow:hidden}
.cat{display:grid;grid-template-columns:22px 1fr auto;column-gap:12px;row-gap:9px;align-items:center;padding:13px 16px 14px;cursor:pointer;position:relative;transition:background .15s}
.cat + .cat{border-top:1px solid var(--line)}
.cat:has(input:checked){background:var(--panel)}
.cat input,.seg input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.radio{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--faint);display:grid;place-items:center;transition:border-color .15s}
.cat input:checked + .radio{border-color:var(--accent)}
.cat input:checked + .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}
.cat input:focus-visible + .radio{outline:2px solid var(--accent);outline-offset:3px}
.cat-name{font-weight:500;display:flex;align-items:center;gap:8px}
.cat-name::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--cat,var(--faint))}
.cat[data-cat="all"] .cat-name::before{display:none}
.cat-count{font-size:.84rem;color:var(--muted);font-variant-numeric:tabular-nums}
.cat .meter{grid-column:2 / 4;height:4px}

.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--panel);border-radius:14px;padding:4px;gap:4px}
.seg label{position:relative}
.seg span{display:block;text-align:center;padding:9px 4px;border-radius:10px;font-size:.92rem;color:var(--muted);cursor:pointer;transition:background .15s,color .15s}
.seg input:checked + span{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(20,40,40,.12)}
.seg input:focus-visible + span{outline:2px solid var(--accent);outline-offset:1px}
.seg-help{font-size:.8rem;color:var(--muted);margin:8px 2px 0;line-height:1.6}

.primary{appearance:none;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:1.05rem;letter-spacing:.04em;padding:17px 20px;border-radius:16px;cursor:pointer;width:100%;transition:transform .1s,filter .15s}
.primary:active{transform:scale(.985)}
.primary:disabled{background:var(--panel-2);color:var(--faint);cursor:not-allowed;transform:none}
.primary small{font-size:.86rem;font-weight:500;margin-left:.4em;opacity:.85}
.start{margin-top:28px}
.hint{min-height:1.5em;font-size:.84rem;color:var(--muted);margin:10px 2px 0;text-align:center}
.home-foot{margin-top:auto;padding:28px 0 22px;display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:space-between;align-items:center;font-size:.78rem;color:var(--faint)}
.home-foot p{margin:0}
.textbtn{appearance:none;background:none;border:0;color:var(--muted);font-size:.8rem;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:6px 0}
.textbtn.danger{color:var(--pen);font-weight:700}

/* ---------- 出題 ---------- */
.quiz-top{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:8px;padding:10px 0 10px}
.iconbtn{appearance:none;width:40px;height:40px;margin-left:-8px;border-radius:12px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer}
.iconbtn:active{background:var(--panel)}
.q-label{font-size:.88rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q-count{font-variant-numeric:tabular-nums;font-size:.95rem;font-weight:500}
.q-count span{color:var(--faint)}
.track{height:3px;background:var(--panel-2);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s ease}

.stage{flex:1;min-height:0;display:flex;align-items:center;padding:16px 0 18px}
.sheet{position:relative;width:100%;height:min(100%,560px);background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 1px 2px rgba(20,40,40,.04),0 14px 34px -22px rgba(20,50,48,.28);padding:18px 22px 20px;display:flex;flex-direction:column;overflow:hidden;transition:transform .22s ease,opacity .22s ease}
.sheet.leave{transform:translateX(-24px);opacity:0}
.sheet.enter{transition:none;transform:translateX(24px);opacity:0}
.sheet-meta{display:flex;align-items:center;gap:10px;font-size:.8rem;color:var(--muted);min-height:22px;flex:none}
.q-no{font-family:var(--mincho);font-weight:700;font-size:.95rem;color:var(--ink);letter-spacing:.04em}
.tag{display:inline-flex;align-items:center;gap:6px;color:var(--cat);font-weight:500}
.tag::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.prev{margin-left:auto;font-size:.74rem;padding:1px 9px;border-radius:99px}
.prev.ng{background:var(--pen-soft);color:var(--pen)}
.prev.ok{background:var(--accent-soft);color:var(--accent)}
.sheet-body{flex:1;min-height:0;overflow-y:auto;margin:0 -6px;padding:0 6px;overscroll-behavior:contain}
.stmt{font-family:var(--mincho);font-weight:600;font-size:1.26rem;line-height:1.9;letter-spacing:.02em;margin:20px 0 0;padding-right:4px}
.verdict{margin-top:22px;padding-top:18px;border-top:1.5px dashed var(--line-strong);animation:rise .28s ease both}
.v-head{display:flex;align-items:center;gap:12px;min-height:40px}
.chip{font-size:.85rem;font-weight:700;padding:3px 12px;border-radius:99px;letter-spacing:.06em}
.chip.ok{background:var(--accent-soft);color:var(--accent)}
.chip.ng{background:var(--pen-soft);color:var(--pen)}
.v-ans{font-size:.95rem;color:var(--muted)}
.v-ans b{font-size:1.15rem;color:var(--ink);margin-left:.3em}
.v-exp{margin:12px 0 0;font-size:.95rem;line-height:1.85}
.mark{flex:none;width:62px;height:62px;margin:-14px -6px -14px auto;pointer-events:none;mix-blend-mode:multiply}
.mark path{fill:none;stroke:var(--pen);stroke-width:8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:0}
.mark.draw path{animation:draw .5s cubic-bezier(.45,.1,.2,1) both}

.actions{flex:none;padding:0 0 14px}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ox-btn{appearance:none;border:1px solid var(--line-strong);background:#fff;border-radius:18px;height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;transition:transform .1s,background .15s,border-color .15s;box-shadow:0 1px 0 rgba(20,40,40,.04)}
.ox-btn:active{transform:scale(.97);background:var(--panel)}
.ox-btn svg{display:block}
.ox-btn span{font-size:.78rem;color:var(--muted);letter-spacing:.08em}
.next{height:84px;font-size:1.1rem}
.keys{margin:10px 0 0;text-align:center;font-size:.74rem;color:var(--faint);min-height:1.2em}
.keys kbd{font-family:inherit;font-size:.7rem;padding:1px 6px;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:5px;margin:0 3px 0 10px;color:var(--muted)}
.keys kbd:first-child{margin-left:0}
@media (hover:none) and (pointer:coarse){.keys{display:none}}

/* ---------- 結果 ---------- */
.result{padding:48px 0 32px}
.result h2{font-family:var(--mincho);font-weight:700;font-size:1.6rem;letter-spacing:.04em;margin:0}
.score{display:flex;align-items:baseline;gap:14px;margin:22px 0 4px}
.score-pct{font-family:var(--mincho);font-weight:700;font-size:3.4rem;line-height:1;font-variant-numeric:tabular-nums}
.score-pct small{font-size:1.3rem;margin-left:2px}
.score-raw{font-size:.95rem;color:var(--muted)}
.score-raw b{color:var(--ink);font-weight:700}
.result .meter{margin-top:14px}
.by-cat{list-style:none;margin:18px 0 0;padding:0;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.by-cat li{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:11px 16px;font-size:.92rem}
.by-cat li + li{border-top:1px solid var(--line)}
.by-cat .bc-name{display:flex;align-items:center;gap:8px}
.by-cat .bc-name::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--cat)}
.by-cat .bc-raw{color:var(--muted);font-variant-numeric:tabular-nums}
.by-cat .bc-pct{font-weight:700;font-variant-numeric:tabular-nums;min-width:3.2em;text-align:right}
.by-cat .low .bc-pct{color:var(--pen)}
.pass-note{font-size:.78rem;color:var(--muted);margin:10px 2px 0;line-height:1.6}
.r-actions{margin-top:26px}
.secondary{appearance:none;width:100%;background:#fff;border:1px solid var(--line-strong);color:var(--ink);font-weight:500;padding:16px;border-radius:16px;cursor:pointer;margin-top:12px}
.secondary:active{background:var(--panel)}
.r-list-title{font-size:.85rem;color:var(--muted);margin:36px 2px 10px;font-weight:500;letter-spacing:.06em}
.ng-list{list-style:none;padding:0;margin:0;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.ng-list li{padding:14px 16px}
.ng-list li + li{border-top:1px solid var(--line)}
.ng-list .lq{margin:0;font-family:var(--mincho);font-weight:600;font-size:.98rem;line-height:1.75}
.ng-list .la{margin:8px 0 0;font-size:.88rem;line-height:1.75;color:var(--muted)}
.ng-list .la b{color:var(--pen);font-size:1rem;margin-right:.5em}

/* 横向きの案内 */
.rotate{display:none}
@media (orientation:landscape) and (max-height:500px) and (pointer:coarse){
  .rotate{display:flex;position:fixed;inset:0;z-index:50;background:var(--bg);flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--muted);font-size:.95rem}
}

@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition:none !important;animation:none !important}
}
@media (max-height:640px){
  .home-head{padding-top:24px}
  .ox-btn,.next{height:72px}
  .stmt{font-size:1.16rem}
}
</style>
</head>
<body data-view="home">
<div id="app">

  <section id="home" class="view" aria-labelledby="title">
    <header class="home-head">
      <h1 id="title">第二種衛生管理者</h1>
      <p class="sub">
        <svg width="34" height="18" viewBox="0 0 34 18" aria-hidden="true"><circle cx="8" cy="9" r="6.2" fill="none" stroke="#D33D2E" stroke-width="2"/><path d="M21 3.5l11 11M32 3.5l-11 11" stroke="#1B2324" stroke-width="2" stroke-linecap="round"/></svg>
        問題集
      </p>
    </header>

    <div class="summary">
      <p class="summary-line"><span id="ov-total">0</span>問中<b id="ov-ok">0</b>問を正解済み</p>
      <div class="meter" aria-hidden="true"><i class="ok" id="ov-mok"></i><i class="ng" id="ov-mng"></i></div>
      <ul class="legend">
        <li style="--sw:var(--accent)">正解済み<b id="lg-ok">0</b></li>
        <li style="--sw:var(--ng-bar)">不正解<b id="lg-ng">0</b></li>
        <li style="--sw:var(--line-strong)">未回答<b id="lg-new">0</b></li>
      </ul>
    </div>

    <fieldset class="group">
      <legend>出題範囲</legend>
      <div class="cat-list" id="cat-list"></div>
    </fieldset>

    <fieldset class="group">
      <legend>出題する問題</legend>
      <div class="seg" id="seg-mode">
        <label><input type="radio" name="mode" value="all"><span>すべて</span></label>
        <label><input type="radio" name="mode" value="new"><span>未正解</span></label>
        <label><input type="radio" name="mode" value="ng"><span>不正解のみ</span></label>
      </div>
      <p class="seg-help" id="mode-help"></p>
    </fieldset>

    <fieldset class="group">
      <legend>問題数</legend>
      <div class="seg" id="seg-count">
        <label><input type="radio" name="count" value="10"><span>10問</span></label>
        <label><input type="radio" name="count" value="30"><span>30問</span></label>
        <label><input type="radio" name="count" value="all"><span>全問</span></label>
      </div>
    </fieldset>

    <button class="primary start" id="start">はじめる</button>
    <p class="hint" id="start-hint" aria-live="polite"></p>

    <footer class="home-foot">
      <p id="save-note">学習記録はこの端末に保存されます</p>
      <span>
        <button class="textbtn" id="reset">学習記録をリセット</button>
        <button class="textbtn danger" id="reset-yes" hidden>リセットする</button>
        <button class="textbtn" id="reset-no" hidden>やめる</button>
      </span>
    </footer>
  </section>

  <section id="quiz" class="view" hidden aria-label="出題">
    <div class="quiz-top">
      <button class="iconbtn" id="quit" aria-label="途中で終える">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <span class="q-label" id="q-label"></span>
      <span class="q-count" id="q-count"></span>
    </div>
    <div class="track" aria-hidden="true"><i id="q-bar"></i></div>

    <div class="stage">
      <article class="sheet" id="sheet" aria-live="polite">
        <div class="sheet-meta">
          <span class="q-no" id="q-no"></span>
          <span class="tag" id="q-tag"></span>
          <span class="prev" id="q-prev" hidden></span>
        </div>
        <div class="sheet-body" id="sheet-body">
          <p class="stmt" id="stmt"></p>
          <div class="verdict" id="verdict" hidden>
            <div class="v-head"><span class="chip" id="v-chip"></span><span class="v-ans">答え<b id="v-ans"></b></span><svg class="mark" id="mark" viewBox="0 0 120 120" aria-hidden="true" hidden><path id="mark-path" pathLength="1" d=""/></svg></div>
            <p class="v-exp" id="v-exp"></p>
          </div>
        </div>
      </article>
    </div>

    <div class="actions">
      <div class="ox" id="ox">
        <button class="ox-btn" id="btn-o" aria-label="○ 正しい">
          <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="14" fill="none" stroke="currentColor" stroke-width="3.2"/></svg>
          <span>正しい</span>
        </button>
        <button class="ox-btn" id="btn-x" aria-label="× 誤り">
          <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><path d="M8.5 8.5l23 23M31.5 8.5l-23 23" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/></svg>
          <span>誤り</span>
        </button>
      </div>
      <button class="primary next" id="next" hidden>次へ</button>
      <p class="keys"><kbd>O</kbd>または<kbd>←</kbd>で○<kbd>X</kbd>または<kbd>→</kbd>で×<kbd>Enter</kbd>で次へ</p>
    </div>
  </section>

  <section id="result" class="view" hidden aria-labelledby="r-title">
    <div class="result">
      <h2 id="r-title">おつかれさまでした</h2>
      <div class="score">
        <span class="score-pct" id="r-pct">0<small>%</small></span>
        <span class="score-raw"><b id="r-ok">0</b> / <span id="r-total">0</span>問 正解</span>
      </div>
      <div class="meter" aria-hidden="true"><i class="ok" id="r-mok"></i><i class="ng" id="r-mng"></i></div>
      <ul class="by-cat" id="r-bycat"></ul>
      <p class="pass-note">本番の合格基準は、科目ごとの得点が40%以上で、かつ合計が60%以上です。</p>
      <div class="r-actions">
        <button class="primary" id="r-retry"></button>
        <button class="secondary" id="r-home">ホームにもどる</button>
      </div>
      <div id="r-list-wrap">
        <p class="r-list-title">まちがえた問題</p>
        <ul class="ng-list" id="r-list"></ul>
      </div>
    </div>
  </section>

</div>

<div class="rotate" aria-hidden="true">
  <svg width="44" height="44" viewBox="0 0 44 44" fill="none"><rect x="13" y="5" width="18" height="34" rx="4" stroke="currentColor" stroke-width="2"/><path d="M19 34h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  <p>縦向きにしてお使いください</p>
</div>

<script>
(() => {
'use strict';

const CAT = { law:'関係法令', hyg:'労働衛生', phy:'労働生理' };
const PREFIX = { L:'law', H:'hyg', P:'phy' };

/* [id, 正誤(1=○ 0=×), 問題文, 解説] */
const RAW = [
// ---- 関係法令 ----
['L01',1,'常時50人以上の労働者を使用する事業場では、業種を問わず衛生管理者を選任しなければならない。','衛生管理者の選任義務は常時50人以上。業種は問わない。'],
['L02',0,'衛生管理者は、選任すべき事由が発生した日から30日以内に選任しなければならない。','正しくは「14日以内」。選任後は遅滞なく、所轄労働基準監督署長に報告する。'],
['L03',0,'常時300人の労働者を使用する事業場では、衛生管理者を3人以上選任しなければならない。','正しくは「2人以上」。50〜200人は1人、201〜500人は2人、501〜1,000人は3人。'],
['L04',1,'常時600人の労働者を使用する事業場では、衛生管理者を3人以上選任しなければならない。','501〜1,000人は3人以上。'],

const QS = RAW.map(r => ({ id:r[0], cat:PREFIX[r[0][0]], t:r[1] === 1, s:r[2], e:r[3] || '' }));
const BY_ID = Object.create(null);
QS.forEach(q => { BY_ID[q.id] = q; });

const $ = id => document.getElementById(id);
const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- PWA（自前でホストしたときだけ有効） ---------- */
(function setupPWA(){
  if (window.top !== window.self || !/^https?:$/.test(location.protocol)) return;
  const add = (rel, href) => { const l = document.createElement('link'); l.rel = rel; l.href = href; document.head.appendChild(l); };
  add('manifest', 'manifest.webmanifest');
  add('apple-touch-icon', 'apple-touch-icon.png');
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
})();

/* ---------- 保存 ---------- */
const LS_PROGRESS = 'eisei2-ox-progress-v1';
const LS_PREFS = 'eisei2-ox-prefs-v1';
const local = {
  get(k){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
function sanitize(p){
  const out = { q:{}, updatedAt:0 };
  if (p && typeof p === 'object') {
    if (p.q && typeof p.q === 'object') {
      for (const k of Object.keys(p.q)) {
        const v = p.q[k];
        if (BY_ID[k] && (v === 1 || v === 2)) out.q[k] = v;
      }
    }
    if (typeof p.updatedAt === 'number') out.updatedAt = p.updatedAt;
  }
  return out;
}
let progress = sanitize(local.get(LS_PROGRESS));
let prefs = Object.assign({ cat:'all', mode:'all', count:'10' }, local.get(LS_PREFS) || {});
if (!['all','law','hyg','phy'].includes(prefs.cat)) prefs.cat = 'all';
if (!['all','new','ng'].includes(prefs.mode)) prefs.mode = 'all';
if (!['10','30','all'].includes(prefs.count)) prefs.count = '10';
const savePrefs = () => local.set(LS_PREFS, prefs);

const statusOf = id => progress.q[id] || 0; // 0 未回答 / 1 正解 / 2 不正解
function setStatus(id, v){
  progress.q[id] = v;
  progress.updatedAt = Date.now();
  local.set(LS_PROGRESS, progress);
  schedulePush();
}

/* claude.ai 上ではアカウントに同期 */
let dbRef = null, writing = false, dirty = false, timer = null, retries = 0;
function schedulePush(){
  if (!dbRef) return;
  dirty = true;
  clearTimeout(timer);
  timer = setTimeout(push, 1200);
}
async function push(){
  if (!dbRef || writing || !dirty) return;
  writing = true; dirty = false;
  try {
    await dbRef.set({ q: Object.assign({}, progress.q), updatedAt: progress.updatedAt });
    retries = 0;
  } catch (e) {
    const code = e && e.code;
    if ((code === 'unavailable' || code === 'resource_exhausted') && retries < 3) { retries++; dirty = true; }
    else { dbRef = null; updateSaveNote(); }
  } finally {
    writing = false;
    if (dirty && dbRef) { clearTimeout(timer); timer = setTimeout(push, 2000 + Math.random() * 2000); }
  }
}
async function connect(){
  if (!window.claude || typeof window.claude.use !== 'function') return;
  try {
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    const ref = db.doc('data/users/' + uid + '/ox');
    const snap = await ref.get();
    dbRef = ref;
    if (snap.exists) {
      const remote = sanitize(snap.data());
      if (remote.updatedAt > progress.updatedAt) {
        progress = remote;
        local.set(LS_PROGRESS, progress);
        if (view === 'home') renderHome();
      } else if (progress.updatedAt > remote.updatedAt) { dirty = true; push(); }
    } else if (progress.updatedAt > 0) { dirty = true; push(); }
    updateSaveNote();
  } catch (e) { /* 端末保存のまま続ける */ }
}
function updateSaveNote(){
  $('save-note').textContent = dbRef
    ? '学習記録はアカウントに保存され、ほかの端末でも続きから使えます'
    : '学習記録はこの端末に保存されます';
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && dirty) { clearTimeout(timer); push(); }
});

/* ---------- 画面切り替え ---------- */
let view = 'home';
function show(v){
  view = v;
  document.querySelectorAll('.view').forEach(s => { s.hidden = s.id !== v; });
  document.body.dataset.view = v;
  window.scrollTo(0, 0);
}

const inCat = cat => cat === 'all' ? QS : QS.filter(q => q.cat === cat);
function poolFor(cat, mode){
  const list = inCat(cat);
  if (mode === 'new') return list.filter(q => statusOf(q.id) !== 1);
  if (mode === 'ng') return list.filter(q => statusOf(q.id) === 2);
  return list;
}
function tally(list){
  let ok = 0, ng = 0;
  for (const q of list) { const s = statusOf(q.id); if (s === 1) ok++; else if (s === 2) ng++; }
  return { ok, ng, t:list.length, n:list.length - ok - ng };
}
const pct = (x, t) => t ? (x / t * 100) + '%' : '0%';
const sessionSize = n => prefs.count === 'all' ? n : Math.min(n, Number(prefs.count));

/* ---------- ホーム ---------- */
const CAT_ROWS = [['all','すべての範囲'],['law',CAT.law],['hyg',CAT.hyg],['phy',CAT.phy]];
(function buildCats(){
  const wrap = $('cat-list');
  for (const [key, label] of CAT_ROWS) {
    const row = document.createElement('label');
    row.className = 'cat';
    row.dataset.cat = key;
    if (key !== 'all') row.style.setProperty('--cat', 'var(--c-' + key + ')');
    row.innerHTML =
      '<input type="radio" name="cat" value="' + key + '">' +
      '<span class="radio" aria-hidden="true"></span>' +
      '<span class="cat-name"></span>' +
      '<span class="cat-count"></span>' +
      '<span class="meter" aria-hidden="true"><i class="ok"></i><i class="ng"></i></span>';
    row.querySelector('.cat-name').textContent = label;
    wrap.appendChild(row);
  }
  wrap.addEventListener('change', e => {
    if (e.target.name === 'cat') { prefs.cat = e.target.value; savePrefs(); renderHome(); }
  });
})();
$('seg-mode').addEventListener('change', e => {
  if (e.target.name === 'mode') { prefs.mode = e.target.value; savePrefs(); renderHome(); }
});
$('seg-count').addEventListener('change', e => {
  if (e.target.name === 'count') { prefs.count = e.target.value; savePrefs(); renderHome(); }
});

const MODE_HELP = {
  all: '選んだ範囲の問題からランダムに出題します。',
  new: 'まだ正解していない問題（未回答と不正解）から出題します。',
  ng: '前回まちがえた問題だけを出題します。'
};
const MODE_LABEL = { all:'', new:'未正解', ng:'不正解のみ' };

function renderHome(){
  const all = tally(QS);
  $('ov-total').textContent = all.t;
  $('ov-ok').textContent = all.ok;
  $('ov-mok').style.width = pct(all.ok, all.t);
  $('ov-mng').style.width = pct(all.ng, all.t);
  $('lg-ok').textContent = all.ok;
  $('lg-ng').textContent = all.ng;
  $('lg-new').textContent = all.n;

  document.querySelectorAll('.cat').forEach(row => {
    const t = tally(inCat(row.dataset.cat));
    row.querySelector('input').checked = prefs.cat === row.dataset.cat;
    row.querySelector('.cat-count').textContent = t.ok + ' / ' + t.t;
    row.querySelector('.meter .ok').style.width = pct(t.ok, t.t);
    row.querySelector('.meter .ng').style.width = pct(t.ng, t.t);
  });
  document.querySelectorAll('#seg-mode input').forEach(i => { i.checked = i.value === prefs.mode; });
  document.querySelectorAll('#seg-count input').forEach(i => { i.checked = i.value === prefs.count; });
  $('mode-help').textContent = MODE_HELP[prefs.mode];

  const pool = poolFor(prefs.cat, prefs.mode).length;
  const n = sessionSize(pool);
  const btn = $('start');
  btn.disabled = n === 0;
  btn.innerHTML = 'はじめる<small>' + n + '問</small>';
  let hint = '';
  if (pool === 0 && prefs.mode === 'ng') hint = '不正解の問題はありません。';
  else if (pool === 0 && prefs.mode === 'new') hint = 'この範囲はすべて正解済みです。「すべて」を選ぶと復習できます。';
  $('start-hint').textContent = hint;
}

$('start').addEventListener('click', () => {
  const pool = poolFor(prefs.cat, prefs.mode);
  if (!pool.length) return;
  const base = prefs.cat === 'all' ? 'すべての範囲' : CAT[prefs.cat];
  const label = MODE_LABEL[prefs.mode] ? base + '　' + MODE_LABEL[prefs.mode] : base;
  startSession(shuffle(pool.slice()).slice(0, sessionSize(pool.length)), label);
});

let resetTimer = null;
function resetUI(confirming){
  $('reset').hidden = confirming;
  $('reset-yes').hidden = !confirming;
  $('reset-no').hidden = !confirming;
}
$('reset').addEventListener('click', () => {
  resetUI(true);
  clearTimeout(resetTimer);
  resetTimer = setTimeout(() => resetUI(false), 6000);
  $('reset-no').focus();
});
$('reset-no').addEventListener('click', () => { clearTimeout(resetTimer); resetUI(false); $('reset').focus(); });
$('reset-yes').addEventListener('click', () => {
  clearTimeout(resetTimer);
  progress = { q:{}, updatedAt: Date.now() };
  local.set(LS_PROGRESS, progress);
  schedulePush();
  resetUI(false);
  renderHome();
  $('start-hint').textContent = '学習記録をリセットしました。';
});

/* ---------- 出題 ---------- */
let S = null;
const sheet = $('sheet');
const MARK_OK = 'M82 18 C 52 6 14 24 14 60 C 14 96 52 110 81 99 C 107 89 112 54 96 32 C 89 22 78 17 64 15';
const MARK_NG = 'M18 56 Q 31 70 45 96 Q 66 52 106 14';

function shuffle(arr){
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function startSession(list, label){
  S = { q:list, i:0, results:[], answered:false, busy:false };
  $('q-label').textContent = label;
  show('quiz');
  renderQ();
  enter();
}
function renderQ(){
  const q = S.q[S.i], total = S.q.length;
  S.answered = false;
  sheet.style.setProperty('--cat', 'var(--c-' + q.cat + ')');
  $('q-no').textContent = '第' + (S.i + 1) + '問';
  $('q-tag').textContent = CAT[q.cat];
  const prev = statusOf(q.id), pv = $('q-prev');
  pv.hidden = prev === 0;
  pv.className = 'prev ' + (prev === 2 ? 'ng' : 'ok');
  pv.textContent = prev === 2 ? '前回不正解' : '前回正解';
  $('stmt').textContent = q.s;
  $('verdict').hidden = true;
  $('mark').setAttribute('hidden', '');
  $('sheet-body').scrollTop = 0;
  $('ox').hidden = false;
  $('next').hidden = true;
  $('q-count').innerHTML = (S.i + 1) + '<span> / ' + total + '</span>';
  $('q-bar').style.width = pct(S.i, total);
}
function enter(){
  if (reduceMotion) return;
  sheet.classList.add('enter');
  void sheet.offsetWidth;
  sheet.classList.remove('enter');
}
function answer(choice){
  if (!S || S.answered || S.busy) return;
  const q = S.q[S.i];
  const ok = choice === q.t;
  S.answered = true;
  S.results.push({ q, ok });
  setStatus(q.id, ok ? 1 : 2);

  const chip = $('v-chip');
  chip.className = 'chip ' + (ok ? 'ok' : 'ng');
  chip.textContent = ok ? '正解' : '不正解';
  $('v-ans').textContent = q.t ? '○' : '×';
  $('v-exp').textContent = q.e || (q.t ? 'この記述は正しい。' : 'この記述は誤り。');
  $('verdict').hidden = false;

  const mark = $('mark');
  $('mark-path').setAttribute('d', ok ? MARK_OK : MARK_NG);
  mark.removeAttribute('hidden');
  mark.classList.remove('draw');
  void mark.getBoundingClientRect();
  mark.classList.add('draw');

  $('q-bar').style.width = pct(S.i + 1, S.q.length);
  $('ox').hidden = true;
  $('next').hidden = false;
  $('next').textContent = S.i + 1 >= S.q.length ? '結果を見る' : '次へ';
  $('next').focus({ preventScroll:true });
  if (!ok && navigator.vibrate) { try { navigator.vibrate(12); } catch(e){} }
}
function next(){
  if (!S || !S.answered || S.busy) return;
  if (S.i + 1 >= S.q.length) { finish(); return; }
  S.busy = true;
  sheet.classList.add('leave');
  setTimeout(() => {
    sheet.classList.remove('leave');
    S.i++;
    S.busy = false;
    renderQ();
    enter();
  }, reduceMotion ? 0 : 180);
}
function quit(){
  if (S && S.results.length) finish();
  else { S = null; show('home'); renderHome(); }
}
$('btn-o').addEventListener('click', () => answer(true));
$('btn-x').addEventListener('click', () => answer(false));
$('next').addEventListener('click', next);
$('quit').addEventListener('click', quit);

document.addEventListener('keydown', e => {
  if (view !== 'quiz' || !S || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  const onButton = e.target && e.target.tagName === 'BUTTON';
  if (!S.answered && (k === 'o' || k === 'O' || k === '1' || k === 'ArrowLeft')) { e.preventDefault(); answer(true); }
  else if (!S.answered && (k === 'x' || k === 'X' || k === '2' || k === 'ArrowRight')) { e.preventDefault(); answer(false); }
  else if (S.answered && (k === 'Enter' || k === ' ' || k === 'ArrowRight') && !onButton) { e.preventDefault(); next(); }
  else if (k === 'Escape') { e.preventDefault(); quit(); }
});

/* ---------- 結果 ---------- */
let lastNg = [];
function finish(){
  const res = S.results, total = res.length;
  const okN = res.filter(r => r.ok).length;
  lastNg = res.filter(r => !r.ok).map(r => r.q);
  const complete = total === S.q.length;
  S = null;

  $('r-title').textContent = complete ? 'おつかれさまでした' : 'ここまでの結果';
  const p = total ? Math.round(okN / total * 100) : 0;
  $('r-pct').innerHTML = p + '<small>%</small>';
  $('r-ok').textContent = okN;
  $('r-total').textContent = total;
  $('r-mok').style.width = pct(okN, total);
  $('r-mng').style.width = pct(total - okN, total);

  const by = {};
  for (const r of res) { (by[r.q.cat] = by[r.q.cat] || { ok:0, t:0 }).t++; if (r.ok) by[r.q.cat].ok++; }
  const cats = Object.keys(CAT).filter(c => by[c]);
  const ul = $('r-bycat');
  ul.textContent = '';
  for (const c of cats) {
    const b = by[c], cp = Math.round(b.ok / b.t * 100);
    const li = document.createElement('li');
    li.style.setProperty('--cat', 'var(--c-' + c + ')');
    if (cp < 40) li.className = 'low';
    li.innerHTML = '<span class="bc-name"></span><span class="bc-raw"></span><span class="bc-pct"></span>';
    li.querySelector('.bc-name').textContent = CAT[c];
    li.querySelector('.bc-raw').textContent = b.ok + ' / ' + b.t;
    li.querySelector('.bc-pct').textContent = cp + '%';
    ul.appendChild(li);
  }
  ul.hidden = cats.length === 0;

  const retry = $('r-retry');
  retry.hidden = lastNg.length === 0;
  retry.textContent = 'まちがえた' + lastNg.length + '問を解き直す';

  const list = $('r-list');
  list.textContent = '';
  for (const q of lastNg) {
    const li = document.createElement('li');
    const s = document.createElement('p'); s.className = 'lq'; s.textContent = q.s;
    const a = document.createElement('p'); a.className = 'la';
    const b = document.createElement('b'); b.textContent = '答え ' + (q.t ? '○' : '×');
    a.append(b, document.createTextNode(q.e || (q.t ? 'この記述は正しい。' : 'この記述は誤り。')));
    li.append(s, a);
    list.appendChild(li);
  }
  $('r-list-wrap').hidden = lastNg.length === 0;
  show('result');
  (lastNg.length ? retry : $('r-home')).focus({ preventScroll:true });
}
$('r-retry').addEventListener('click', () => {
  if (lastNg.length) startSession(shuffle(lastNg.slice()), 'まちがえた問題の解き直し');
});
$('r-home').addEventListener('click', () => { show('home'); renderHome(); });

/* ---------- 起動 ---------- */
renderHome();
updateSaveNote();
connect();
})();
</script>
</body>
</html>
