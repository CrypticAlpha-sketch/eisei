<!doctype html>
<html lang="ja" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="衛生管理者">
<meta name="theme-color" content="#EDF0F3" id="themeColor">
<script>try{var t=localStorage.getItem("eisei2-theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<title>第二種衛生管理者 過去問ランダム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#EDF0F3; --paper:#FFFFFF; --ink:#1A2230; --ink2:#586274; --ink3:#8C95A4; --rule:#D8DDE4;
  --law:#2457A8; --hyg:#0E7C66; --phy:#7449B0;
  --marker:#FFE14A; --stamp:#D3352A; --hit:#FFF8D6; --sel:#EEF1F6;
  --dot:#D3D9E1; --btn:#1A2230; --btn-ink:#FFFFFF; --scrim:rgba(20,26,36,.45);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111419; --paper:#1A1F27; --ink:#E8EBF0; --ink2:#A2AABA; --ink3:#6E7787; --rule:#2B323D;
    --law:#79A3EE; --hyg:#45C6A4; --phy:#B497EA;
    --marker:rgba(255,214,10,.42); --stamp:#FF5D4F; --hit:rgba(255,214,10,.11); --sel:#232A35;
    --dot:#2A313B; --btn:#E8EBF0; --btn-ink:#111419; --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111419; --paper:#1A1F27; --ink:#E8EBF0; --ink2:#A2AABA; --ink3:#6E7787; --rule:#2B323D;
  --law:#79A3EE; --hyg:#45C6A4; --phy:#B497EA;
  --marker:rgba(255,214,10,.42); --stamp:#FF5D4F; --hit:rgba(255,214,10,.11); --sel:#232A35;
  --dot:#2A313B; --btn:#E8EBF0; --btn-ink:#111419; --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  font-size:16px;line-height:1.65;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2.5px solid var(--law);outline-offset:2px;border-radius:6px}
mark{background:linear-gradient(transparent 52%,var(--marker) 52%);color:inherit;padding:0 .08em}
.wrap{max-width:560px;margin:0 auto;padding-left:16px;padding-right:16px}
.law{color:var(--law);--sc:var(--law)} .hyg{color:var(--hyg);--sc:var(--hyg)} .phy{color:var(--phy);--sc:var(--phy)}
.num-t{font-variant-numeric:tabular-nums}

/* theme toggle */
.tt{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:12px;color:var(--ink)}
.tt svg{width:22px;height:22px}
.tt .sun{display:none} :root[data-theme="dark"] .tt .sun{display:block} :root[data-theme="dark"] .tt .moon{display:none}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-new(root){z-index:2}
.wipe{position:fixed;inset:0;z-index:100;pointer-events:none}

/* ---------- home ---------- */
.home{padding-top:14px;padding-bottom:128px}
.title{padding:12px 2px 14px;position:relative}
.title .tt{position:absolute;top:2px;right:-6px}
.title small{display:block;color:var(--ink2);font-size:13px;padding-right:44px}
.title h1{margin:2px 0 0;font-size:26px;line-height:1.3;font-weight:700;padding-right:44px}
.title p{margin:6px 0 0;color:var(--ink2);font-size:13px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--paper);border-radius:13px;padding:4px;margin-bottom:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:8;box-shadow:0 0 0 6px var(--bg)}
.tabs button{min-height:42px;border-radius:10px;font-size:15px;color:var(--ink2)}
.tabs button[aria-selected="true"]{background:var(--btn);color:var(--btn-ink);font-weight:700}

.panel{background:var(--paper);border-radius:14px;padding:16px;margin-bottom:18px}
.panel h2{margin:0 0 6px;font-size:14px;color:var(--ink2);font-weight:700}
.g-row{display:grid;grid-template-columns:5.2em 1fr 3.2em;align-items:center;gap:10px;padding:9px 0}
.g-row+.g-row{border-top:1px solid var(--rule)}
.g-name{font-weight:700;font-size:15px}
.g-bar{position:relative;height:12px;border-radius:6px;background:var(--bg)}
.g-fill{position:absolute;inset:0 auto 0 0;border-radius:6px;background:currentColor;transition:width .5s ease}
.g-cut{position:absolute;top:-5px;bottom:-5px;width:0;border-left:2px dashed var(--stamp)}
.g-num{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;font-size:15px;color:var(--ink)}
.g-sub{grid-column:2 / 4;margin-top:-6px;font-size:12px;color:var(--ink3)}
.g-legend{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--ink2);padding-top:8px}
.g-legend i{display:inline-block;width:14px;border-top:2px dashed var(--stamp)}
.g-row.tot{color:var(--ink)}

.weak{list-style:none;margin:0;padding:0}
.weak li{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:9px 0}
.weak li+li{border-top:1px solid var(--rule)}
.weak .wt{font-size:15px;font-weight:700;line-height:1.4}
.weak .ws{font-size:12.5px;color:var(--ink2)}
.weak .ws b{color:var(--stamp)}
.mini{min-height:38px;padding:0 14px;border-radius:19px;border:1.5px solid var(--ink);font-size:14px;font-weight:700;white-space:nowrap}

.field{margin-bottom:18px}
.field h3{margin:0 0 8px;font-size:14px;color:var(--ink2);font-weight:700}
.field .desc{font-size:12.5px;color:var(--ink2);margin:8px 2px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:8px 14px;border-radius:20px;background:var(--paper);border:1.5px solid var(--rule);font-size:15px;color:var(--ink2);display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{border-color:currentColor;font-weight:700;color:var(--ink)}
.chip.law[aria-pressed="true"]{color:var(--law);background:color-mix(in srgb,var(--law) 9%,var(--paper))}
.chip.hyg[aria-pressed="true"]{color:var(--hyg);background:color-mix(in srgb,var(--hyg) 9%,var(--paper))}
.chip.phy[aria-pressed="true"]{color:var(--phy);background:color-mix(in srgb,var(--phy) 9%,var(--paper))}
.chip.md[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.chip .ck{width:16px;height:16px;border-radius:50%;border:1.5px solid currentColor;display:inline-block;position:relative}
.chip[aria-pressed="true"] .ck{background:currentColor}
.chip[aria-pressed="true"] .ck::after{content:"";position:absolute;left:4.5px;top:1.5px;width:4px;height:8px;border:solid var(--paper);border-width:0 2px 2px 0;transform:rotate(45deg)}
.rounds{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}
.rounds::-webkit-scrollbar{display:none}
.rounds .chip{flex:none;font-size:14px}
.foot{margin-top:24px;font-size:12px;color:var(--ink3);line-height:1.7}
.foot button{color:var(--stamp);text-decoration:underline;font-size:13px;margin-top:8px;padding:6px 0}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));
  background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--rule)}
.bar .in,.in{max-width:560px;margin:0 auto;display:flex;gap:8px}
.go{flex:1;min-height:54px;border-radius:14px;background:var(--btn);color:var(--btn-ink);font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:10px;transition:opacity .15s,transform .1s}
.go:active{transform:scale(.985)}
.go[disabled]{opacity:.3}
.go .cnt{font-weight:400;font-size:14px;opacity:.8}
.ghost{min-height:54px;padding:0 14px;border-radius:14px;border:1.5px solid var(--rule);background:var(--paper);font-size:15px;color:var(--ink);white-space:nowrap}
.ghost[disabled]{opacity:.35}
.sq{flex:none;width:54px;min-height:54px;border-radius:14px;border:1.5px solid var(--rule);background:var(--paper);display:grid;place-items:center;color:var(--ink2)}
.sq svg{width:22px;height:22px}
.sq[aria-pressed="true"]{color:var(--stamp);border-color:var(--stamp);background:color-mix(in srgb,var(--stamp) 8%,var(--paper))}
.sq[aria-pressed="true"] svg{fill:currentColor}

/* ---------- exam tab ---------- */
.rule-list{margin:0;padding:0;list-style:none;font-size:15px}
.rule-list li{padding:7px 0;display:grid;grid-template-columns:5.4em 1fr;gap:8px}
.rule-list li+li{border-top:1px solid var(--rule)}
.rule-list b{color:var(--ink2);font-size:13.5px;font-weight:700;padding-top:1px}
.rec{list-style:none;margin:0;padding:0}
.rec li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0;font-size:14px}
.rec li+li{border-top:1px solid var(--rule)}
.rec .pf{font-weight:700;font-size:13px;border:1.5px solid currentColor;border-radius:6px;padding:1px 7px}
.rec .pf.p{color:var(--stamp)} .rec .pf.f{color:var(--ink3)}
.rec .sc{color:var(--ink2);font-size:13px}
.rec .tl{font-weight:700;font-variant-numeric:tabular-nums;font-size:16px}

/* ---------- notes tab ---------- */
.nt-h{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;margin:18px 2px 8px}
.nt-h::before{content:"";width:10px;height:10px;border-radius:2px;background:currentColor}
.nt{background:var(--paper);border-radius:14px;overflow:hidden;margin-bottom:8px}
.nt>button{display:grid;grid-template-columns:1fr auto 18px;gap:10px;align-items:center;width:100%;text-align:left;padding:12px 14px;min-height:56px}
.nt .nn{font-size:15.5px;font-weight:700;line-height:1.4}
.nt .ns{display:block;font-size:12px;color:var(--ink2);font-weight:400}
.nt .nr{font-variant-numeric:tabular-nums;font-size:14px;font-weight:700;color:var(--ink)}
.nt .nr.low{color:var(--stamp)} .nt .nr.na{color:var(--ink3);font-weight:400}
.nt .cv{width:9px;height:9px;border:solid var(--ink3);border-width:0 2px 2px 0;transform:rotate(45deg);transition:transform .2s;justify-self:center;margin-top:-4px}
.nt[data-open="1"] .cv{transform:rotate(-135deg);margin-top:4px}
.nt .body{padding:0 10px 12px}
.nt .body .nb{margin:0 0 10px;border:1px solid var(--rule)}

/* ---------- quiz ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--bg)}
.top .in{padding:6px 4px;align-items:center;gap:4px}
.x{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:10px}
.x svg{width:22px;height:22px}
.top .meta{flex:1;min-width:0;font-size:12.5px;color:var(--ink2);line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .meta b{display:block;color:var(--ink);font-size:14.5px}
.score{font-variant-numeric:tabular-nums;font-size:14px;font-weight:700;padding:0 4px;white-space:nowrap;text-align:right;line-height:1.3}
.score span{color:var(--ink3);font-weight:400}
.score .stk{display:block;font-size:11.5px;color:var(--stamp)}
.timer{font-variant-numeric:tabular-nums;font-size:17px;font-weight:700;padding:0 6px;letter-spacing:.02em}
.timer.low{color:var(--stamp)}
.prog{height:3px;background:var(--rule)}
.prog i{display:block;height:100%;background:var(--ink);transition:width .35s ease}

.quiz{padding-top:14px;padding-bottom:140px}
.qcard{position:relative;background:var(--paper);border-radius:16px;padding:16px 16px 0;overflow:hidden}
.qtag{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin-bottom:8px}
.qtag::before{content:"";width:10px;height:10px;border-radius:2px;background:currentColor}
.qtag em{font-style:normal;color:var(--ink2);font-weight:400}
.stem{font-size:17px;font-weight:700;line-height:1.6;margin:0 0 4px}
.done .stem{padding-right:86px;min-height:58px}
.given{margin:10px 0 4px;padding:10px 12px;border-radius:10px;background:var(--bg);font-size:14.5px;line-height:1.65}
.given div+div{margin-top:4px}
.hint{margin:10px 0 0;font-size:12px;color:var(--ink3);display:flex;gap:14px;flex-wrap:wrap}
.hint span{display:inline-flex;align-items:center;gap:5px}
.hint i{font-style:normal;display:inline-grid;place-items:center;width:22px;height:16px;border:1.3px solid var(--ink3);border-radius:8px;font-size:10px}
.hint s{text-decoration-thickness:1.3px}

.rows{list-style:none;margin:10px -16px 0;padding:0}
.row{display:grid;grid-template-columns:62px 1fr;border-top:1px solid var(--rule);position:relative;transition:background .15s}
.row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--ink);transform:scaleY(0);transition:transform .15s}
.num{display:grid;justify-items:center;align-content:start;padding-top:16px;min-height:60px}
.bub{position:relative;width:36px;height:25px;border-radius:13px;border:1.6px solid var(--ink3);display:grid;place-items:center;font-size:13.5px;color:var(--ink2);font-variant-numeric:tabular-nums;transition:background .12s,color .12s,border-color .12s,transform .12s}
.num:active .bub{transform:scale(.9)}
.txt{text-align:left;padding:13px 16px 13px 0;font-size:16px;line-height:1.6;min-height:60px}
.ct{text-decoration:line-through;text-decoration-color:transparent;text-decoration-thickness:1.4px;transition:color .18s,text-decoration-color .18s}
.row.sel{background:var(--sel)}
.row.sel::before{transform:scaleY(1)}
.row.sel .bub{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.row.elim .ct{color:var(--ink3);text-decoration-color:var(--ink2)}
.done .num,.done .txt{cursor:default}
.done .row::before{display:none}
.done .row.sel{background:transparent}
.done .row.isans{background:var(--hit)}
.done .row.isans .ct{font-weight:700;color:var(--ink);text-decoration-color:transparent}
.done .row.isans .bub::after{content:"";position:absolute;inset:-8px -7px;border:2.6px solid var(--stamp);border-radius:50%;transform:rotate(-8deg)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.tg{font-size:12px;line-height:1.5;padding:1px 8px;border-radius:10px;border:1.3px solid var(--rule);color:var(--ink2);white-space:nowrap}
.tg.a{background:var(--stamp);border-color:var(--stamp);color:#fff;font-weight:700}
.tg.m{border-color:var(--ink);color:var(--ink);font-weight:700}
.tg.tx{color:var(--stamp);border-color:color-mix(in srgb,var(--stamp) 45%,transparent)}

.mk{position:absolute;pointer-events:none;color:var(--stamp)}
.mk path{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:0}
.mk.hana{top:2px;right:2px;width:96px;height:96px;transform:rotate(-8deg)}
.mk.hana path{stroke-width:4.2}
.mk.batsu{top:14px;right:16px;width:62px;height:62px}
.mk.batsu path{stroke-width:9}
.stamp{width:104px;height:104px;border-radius:50%;border:3.5px solid var(--stamp);color:var(--stamp);display:grid;place-items:center;transform:rotate(-12deg);font-weight:700;font-size:27px;letter-spacing:.08em;
  box-shadow:inset 0 0 0 4px var(--paper),inset 0 0 0 5.5px var(--stamp);margin:6px auto 10px}
@media (prefers-reduced-motion:no-preference){
  .mk.hana .d1{animation:draw .8s cubic-bezier(.45,0,.25,1) both}
  .mk.batsu .d1{animation:draw .2s ease-out both}
  .mk.batsu .d2{animation:draw .2s ease-out .2s both}
  @keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
  .stamp{animation:press .34s cubic-bezier(.2,.9,.3,1.4) both .15s}
  @keyframes press{0%{opacity:0;transform:rotate(-12deg) scale(1.9)}60%{opacity:1}100%{opacity:1;transform:rotate(-12deg) scale(1)}}
  .expl{animation:rise .35s ease both .1s}
  .qcard.enter{animation:rise .28s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .sheet,.dlg{animation:up .26s cubic-bezier(.2,.8,.2,1) both}
  @keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
  .scrim{animation:fade .2s ease both}
  @keyframes fade{from{opacity:0}to{opacity:1}}
}

.expl{margin-top:14px}
.verdict{display:flex;align-items:baseline;gap:10px;padding:0 4px 10px;font-size:15px}
.verdict b{font-size:18px}
.verdict .ok{color:var(--stamp)}
.legend{font-size:12.5px;color:var(--ink2);padding:0 4px 10px;margin-top:-4px}
.nb{position:relative;background-color:var(--paper);border-radius:14px;margin-bottom:12px;overflow:hidden;
  background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:14px 14px;background-position:7px 7px}
.nb header{display:flex;align-items:center;gap:10px;padding:12px 14px 10px;border-bottom:2px solid currentColor;background:var(--paper)}
.nb .sj{font-size:11.5px;font-weight:700;color:var(--paper);background:var(--sc);border-radius:5px;padding:2px 7px;white-space:nowrap}
.nb h4{margin:0;font-size:15.5px;color:var(--ink);flex:1;line-height:1.4}
.nb .pg{font-size:12px;color:var(--ink2);white-space:nowrap}
.nb ul{list-style:none;margin:0;padding:8px 14px 12px;color:var(--ink)}
.nb li{padding:6px 0;font-size:14.5px;line-height:1.7;background:var(--paper);box-shadow:0 0 0 4px var(--paper);margin:2px 0;border-radius:2px}
.nb li+li{border-top:1px dashed var(--rule)}
.trap{position:relative;margin:0 12px 12px;padding:10px 12px 10px 20px;border:1.5px solid var(--ink);border-radius:10px;background:var(--paper);color:var(--ink)}
.trap::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;border-radius:8px 0 0 8px;background:repeating-linear-gradient(-45deg,#F2C500 0 5px,#1A2230 5px 10px)}
.trap b{font-size:13px}
.trap ul{padding:2px 0 0;margin:0}
.trap li{padding:3px 0;border:0 !important;font-size:14px;box-shadow:none}
.trap li::before{content:"・"}
.extra{background:var(--paper);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:14.5px;border:1.5px dashed var(--rule)}
.extra .lb{font-size:12.5px;color:var(--ink2);font-weight:700}

/* ---------- result ---------- */
.res{background:var(--paper);border-radius:16px;padding:22px 18px;text-align:center;margin-bottom:14px;position:relative;overflow:hidden}
.res h2{margin:0 0 4px;font-size:15px;color:var(--ink2)}
.res .big{font-size:52px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.res .big small{font-size:20px;color:var(--ink2);font-weight:400}
.res .fail{font-size:26px;font-weight:700;margin:8px 0 6px}
.res p{margin:4px 0 0;color:var(--ink2);font-size:14px}
.res .why{color:var(--stamp);font-weight:700}
.res .mk.hana{position:static;display:block;margin:0 auto 4px;width:120px;height:120px}
.ms-g{text-align:left;margin-top:14px}
.ms-g .mh{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;font-weight:700;margin-bottom:6px}
.ms-g .mh span{color:var(--ink);font-variant-numeric:tabular-nums}
.ms-g .mh span.ng{color:var(--stamp)}
.ms{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.ms button{position:relative;aspect-ratio:1/1.05;border-radius:9px;border:1.6px solid var(--ink3);font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums;display:grid;place-items:center;min-width:0}
.ms button.f{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.ms button.cur{outline:2.5px solid var(--stamp);outline-offset:1.5px}
.ms button.fl::after{content:"";position:absolute;top:-4px;right:-4px;width:10px;height:10px;border-radius:50%;background:var(--stamp);border:2px solid var(--paper)}
.ms button.ok{background:var(--sc);border-color:var(--sc)}
.ms button.ok b{color:var(--paper);font-weight:400}
.ms button.ng{border-color:var(--stamp);color:var(--stamp)}
.ms button.ng::before{content:"";position:absolute;left:15%;right:15%;top:50%;height:1.6px;background:var(--stamp);transform:rotate(-38deg)}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--paper);border-radius:20px 20px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
.sheet h3{margin:0 0 2px;font-size:17px}
.sheet .sub{margin:0;color:var(--ink2);font-size:13px}
.sheet .in{margin-top:16px}
.dlg{position:fixed;left:16px;right:16px;top:50%;margin-top:-90px;z-index:41;background:var(--paper);border-radius:18px;padding:20px 18px 16px;max-width:420px;margin-left:auto;margin-right:auto}
.dlg h3{margin:0 0 6px;font-size:17px}
.dlg p{margin:0 0 16px;color:var(--ink2);font-size:14.5px}
.dlg .go.danger{background:var(--stamp);color:#fff}
.dlg .go,.dlg .ghost{min-height:48px;font-size:15.5px}
</style>

<script>
const R=[];
R.push({id:"2021-10",label:"2021年10月公表",q:[
[1,"衛生管理体制について、正しいものは？（選任の特例なし）",["衛生管理者を選任したら、遅滞なく、所定の様式の報告書を労基署長に提出する","常時2,000人超3,000人以下では、衛生管理者を4人選任する","常時50人以上の警備業では、第二種免許者から衛生管理者を選任できない","常時800人以上では、専属の産業医を選任する","常時300人超500人未満で深夜業に常時100人以上が従事する事業場では、衛生工学衛生管理者免許者から選任する"],1,"L_tetsuzuki L_ninzu"],
[2,"常時300人の事業場のうち、総括安全衛生管理者の選任が義務でない業種は？",["通信業","各種商品小売業","旅館業","ゴルフ場業","医療業"],5,"L_gyoshu"],
[3,"産業医について、誤っているものは？",["事業者は、産業医が健康管理等に必要と認める労働者の業務に関する情報を提供する","産業医の業務の内容、健康相談の申出方法、心身の状態に関する情報の取扱い方法を労働者に周知する","産業医は、衛生委員会に対して必要な調査審議を求めることができる","衛生委員会の議事概要を毎月1回以上提供されていれば、産業医の巡視を2か月に1回以上にできる","産業医の勧告の内容と講じた措置（講じない場合はその旨と理由）を記録し、3年間保存する"],4,"L_sangyoui"],
[4,"健康診断について、法令に違反しているものは？",["雇入時健診で、3か月以内に受けた健診の結果を証明する書面が出されたので、相当する項目を省略している","雇入時健診の聴力検査を、35歳・40歳・45歳以上は1,000Hzと4,000Hzで行い、それ以外の年齢は医師が適当と認める方法で行っている","深夜業に常時従事する者に6か月以内ごとに1回健診を行い、胸部エックス線検査は1年以内ごとに1回行っている","定期健診の異常所見者について、健診日から3か月以内に医師の意見を聴いている","常時50人の事業場で、定期健診の結果は労基署長に報告しているが、雇入時健診の結果は報告していない"],2,"L_kenshin_item L_kenshin_when"],
[5,"ストレスチェックと面接指導について、正しいものは？",["常時50人以上の事業場では、6か月以内ごとに1回ストレスチェックを行う","結果が衛生管理者と受検した労働者に通知されるようにする","検査項目は「心理的な負担の原因」「心理的な負担による心身の自覚症状」「他の労働者による支援」","高ストレスと判定された労働者全員に、医師の面接指導を行う","面接指導の結果の記録を作成し、3年間保存する"],3,"L_stress L_jisshisha"],
[7,"衛生基準に違反していないものは？",["大掃除を1年に1回、定期に統一的に行っている","男性25人・女性25人の事業場で、臥床できる休養室を男女別に設けていない","男性用小便所を、同時に就業する男性50人以内ごとに1個以上にしている","食堂の床面積を、1人当たり0.8m²にしている","有害業務なし。直接外気に開放できる窓等の面積が常時床面積の1/15の屋内作業場に、換気設備を設けていない"],5,"L_shisetsu L_sagyoba"],
[8,"空調・機械換気設備で室に供給する空気について、A・Bの組合せで正しいものは？\n① 空気1m³中の浮遊粉じん量が［A］mg以下\n② 空気1m³中のホルムアルデヒドの量が［B］mg以下",["A 0.15・B 0.1","A 0.15・B 0.3","A 0.5・B 0.1","A 0.5・B 0.3","A 0.5・B 0.5"],1,"L_air"],
[9,"労働時間等について、正しいものは？",["1日8時間を超えて働かせられるのは、36協定を届け出た場合に限られる","事業場が異なる場合は、労働時間を通算しない","8時間を超える場合は、少なくとも45分の休憩を与える","機密の事務を扱う労働者には、労基署長の許可がなくても労働時間の規定は適用されない","監視・断続的労働で労基署長の許可を受ければ、労働時間と年次有給休暇の規定は適用されない"],4,"L_jikan"],
[10,"週25時間・週4日勤務で、継続勤務3年6か月（直前1年の出勤率8割以上）。その後1年間に与える年休の日数は？",["8日","9日","10日","11日","12日"],3,"L_nenkyu"],
[11,"一般の事務室の換気についてA〜Dのうち、誤っているものの組合せは？\nA 呼気の酸素濃度は約16％、二酸化炭素濃度は約4％\nB 外気の酸素濃度は約21％、二酸化炭素濃度は0.3〜0.4％程度\nC 必要換気量＝1時間の呼出CO₂量÷（室内CO₂基準濃度％−外気CO₂濃度％）×100\nD 室内CO₂基準濃度は、通常1％とする",["A・B","A・C","B・C","B・D","C・D"],4,"E_kanki"],
[12,"温熱条件について、誤っているものは？",["温度感覚を左右する要素は気温・湿度・気流の三つで、これで温熱環境が決まる","気温・湿度・気流の総合効果を実験的に求め、温度目盛で表したものが実効温度","WBGTは熱ストレスの評価指標で、屋内では自然湿球温度と黒球温度から求める","WBGT基準値は、熱に順化している人の方が順化していない人より大きい","相対湿度は、水蒸気分圧とその温度の飽和水蒸気圧の比を百分率で表したもの"],1,"E_wbgt"],
[13,"照明・採光について、誤っているものは？",["北向きの窓は直射日光がほぼ入らないが、一年中平均した明るさが得られる","全般照明と局部照明を併用するとき、全般照明の照度を局部照明の1/5程度にしている","前方から明かりをとるとき、目と光源を結ぶ線と視線の角度が40°程度になるようにしている","照明設備は1年以内ごとに1回点検し、異常があれば電球交換などをしている","目の高さ以下は濁色、目より上の壁や天井は明るい色にする"],4,"E_shomei L_tenken"],
[14,"労働衛生の統計について、誤っているものは？",["正規分布する指標のばらつきの程度は、平均値や最頻値で表す","平均値が等しくても分散が異なれば、異なる特徴をもつ集団と評価される","ある時点の検査での有所見者の割合を有所見率といい、静態データという","対象人数・受診者数などは計数データ、身長・体重などは計量データ","相関関係が認められても、因果関係がないこともある"],1,"E_toukei"],
[15,"腰痛予防対策指針について、正しいものは？",["腰部保護ベルトは、重量物取扱い作業の労働者全員に使わせる","満18歳以上の男性が人力で扱う重量は、体重のおおむね50％以下","重量物取扱い作業の労働者には、配置時と1年以内ごとに1回、腰痛の健診を行う","立ち作業では、床は弾力のない硬い素材にし、クッション性のない靴を使う","腰掛け作業は、椅子に深く腰かけて背もたれで体幹を支え、足裏全体を床につける姿勢を基本にする"],5,"E_youtsu","(5)の腰掛け姿勢はノートに直接の記載なし。ほかの4つはノートの記載と逆の内容なので、消去法で(5)。"],
[16,"出血・止血法と救急処置について、誤っているものは？",["全血液量は体重の約1/13で、その約1/3を短時間に失うと命に関わる","傷口が泥で汚れているときは、手際よく水道水で洗い流す","止血法には直接圧迫法・間接圧迫法などがあり、一般人には直接圧迫法が推奨される","静脈性出血は擦り傷のときにみられ、傷口から少しずつにじみ出る","止血帯の後、医師への引継ぎまで30分以上かかるときは、30分ごとに1〜2分、血がにじむ程度まで結び目をゆるめる"],4,"E_shukketsu"],
[17,"虚血性心疾患について、誤っているものは？",["虚血性心疾患は、門脈からの心筋への血液供給が不足・途絶して起こる","危険因子には、高血圧・喫煙・脂質異常症などがある","可逆的な狭心症と、不可逆的な壊死が起こる心筋梗塞に大別される","心筋梗塞は突然激しい胸痛が起こり、1時間以上続くこともある","狭心症の発作は通常数分程度、長くても15分以内におさまることが多い"],1,"E_noushin"],
[18,"細菌性食中毒について、誤っているものは？",["黄色ブドウ球菌の毒素は熱に強い","ボツリヌス菌の毒素は神経毒","腸炎ビブリオは病原性好塩菌とも呼ばれる","サルモネラ菌の食中毒は、食品中で菌が増えるときにできる毒素で起こる","ウェルシュ菌・セレウス菌・カンピロバクターは、いずれも細菌性食中毒の原因菌"],4,"E_shokuchu"],
[19,"情報機器作業ガイドラインについて、適切でないものは？",["画面上の照度を500ルクス以下にしている","画面の位置・傾き・向きなどを調整してグレアを防いでいる","視距離をおおむね30cm以内とし、画面の上端を眼の高さよりやや下にしている","1日の作業が4時間未満の者は、自覚症状を訴える者だけを定期健診の対象にしている","情報機器作業の定期健診を、1年以内ごとに1回行っている"],3,"E_joho"],
[20,"労働安全衛生マネジメントシステム指針について、誤っているものは？",["この指針は、危険や健康障害を防ぐために事業者が講ずべき具体的な措置を定めるものではない","このシステムは、生産管理など事業実施の管理と一体で運用される","事業者は安全衛生方針を表明し、労働者や関係請負人などに周知する","事業者は、リスクアセスメントの結果等に基づき、期間を限って安全衛生計画を作成する","措置が適切に実施されているかを評価するため、外部の機関の監査を受けなければならない"],5,"E_3kanri"],
[21,"神経系について、誤っているものは？",["神経細胞（ニューロン）は通常、細胞体1個・軸索1本・樹状突起複数から成る","体性神経は運動と感覚に、自律神経は呼吸や循環などに関わる","大脳の皮質は細胞体が集まった灰白質で、感覚・思考などの中枢","交感神経と副交感神経は、各臓器に両方が分布し、相反する作用をもつ","交感神経は体を活動的に調節し、心拍数を増やし、消化管の運動を高める"],5,"S_shinkei"],
[22,"心臓と血液循環について、誤っているものは？",["心臓は、自律神経の中枢で発生した刺激が刺激伝導系を通じて心筋に伝わり、収縮・拡張する","肺循環で左心房に戻った血液は、左心室を経て大動脈に入る","大動脈には動脈血、肺動脈には静脈血が流れる","脈拍は末梢の動脈で触れる動脈圧の変動で、一般に手首の橈骨動脈で測る","動脈硬化は動脈壁が厚く硬くなって弾力を失った状態で、進むと狭窄や閉塞を招く"],1,"S_junkan"],
[23,"消化器系について、誤っているものは？",["糖質はブドウ糖などに、蛋白質はアミノ酸に、脂肪は脂肪酸とグリセリンに、酵素で分解されて吸収される","無機塩とビタミン類は、酵素で分解されずにそのまま吸収される","膵臓から十二指腸に出る膵液には、消化酵素は含まれず、血糖値を調節するホルモンが含まれる","ペプシノーゲンは胃酸でペプシンになり、蛋白質を分解する","小腸の表面は絨毛で覆われ、吸収効率を上げている"],3,"S_shoka"],
[24,"呼吸について、誤っているものは？",["呼吸運動は、気管と胸膜の協調運動で胸郭の容積を周期的に増減させて行う","胸郭の容積が増え内圧が下がると、気道を通って肺に空気が流れ込む（吸気）","肺胞内の空気と毛細血管の血液との間のガス交換を、肺呼吸または外呼吸という","全身の毛細血管の血液が組織細胞に酸素を渡しCO₂を受け取るガス交換を、組織呼吸または内呼吸という","血液中のCO₂濃度が上がると呼吸中枢が刺激され、肺でのガス交換の量が増える"],1,"S_kokyu"],
[25,"腎臓・泌尿器系について、誤っているものは？",["腎小体では、糸球体から蛋白質以外の血漿成分がボウマン嚢にこし出され、原尿ができる","尿細管では、原尿の大部分の水分と必要な成分が血液中に再吸収される","尿は淡黄色で固有の臭気があり、通常は弱酸性","尿の生成で、体内の水分量や電解質濃度を調節し、不要な物質を排出する","尿の成分は健康状態をよく反映するので、尿を採って尿素窒素の検査が広く行われている"],5,"S_jinzo"],
[26,"代謝について、正しいものは？",["体脂肪やグリコーゲンを分解してエネルギーを出し、ATPを合成することを同化という","ATPのエネルギーを使って、栄養素から蛋白質など生体に必要な物質を合成することを異化という","基礎代謝量は、安静時の生命維持に必要な代謝量で、睡眠中の測定値で表す","エネルギー代謝率は、消費された酸素と排出された二酸化炭素の容積比で表す","エネルギー代謝率は動的筋作業の強度を表せるが、精神的作業や静的筋作業には使えない"],5,"S_taisha"],
[27,"耳とその機能について、誤っているものは？",["耳は聴覚・平衡感覚などをつかさどり、外耳・中耳・内耳に分かれる","耳介で集めた音は鼓膜を振動させ、耳小骨で増幅されて内耳に伝わる","内耳は前庭・半規管・蝸牛から成り、前庭と半規管が平衡感覚、蝸牛が聴覚を担う","半規管は体の傾きの方向や大きさを、前庭は体の回転の方向や速度を感じる","鼓室は耳管で咽頭に通じ、内圧は外気圧と等しく保たれる"],4,"S_mimi"],
[28,"抗体についてA〜Cの組合せで適切なものは？\n抗体とは、体内に入った［A］に対して［B］免疫で作られる［C］と呼ばれる蛋白質で、［A］に特異的に結合してその働きを抑える",["A 化学物質／B 体液性／C アルブミン","A 化学物質／B 細胞性／C 免疫グロブリン","A 抗原／B 体液性／C アルブミン","A 抗原／B 体液性／C 免疫グロブリン","A 抗原／B 細胞性／C アルブミン"],4,"S_meneki"],
[29,"体温調節について、誤っているものは？",["寒いときは皮膚の血管が収縮し、熱の放散が減る","暑いときは内臓の血流が増え、代謝が高まって熱の放散が促される","外部環境が変わっても体内を一定に保とうとする性質を恒常性（ホメオスタシス）という","体重70kgの人の体表面から100gの水分が蒸発すると、体温は約1℃下がる","熱の放散は、ふく射・伝導・蒸発などで行われ、蒸発には発汗と不感蒸泄がある"],2,"S_taion"],
[30,"睡眠について、誤っているものは？",["約1日周期の生物学的リズムをサーカディアンリズムといい、その乱れは疲労や睡眠障害の原因になる","睡眠は、目の動きなどでレム睡眠とノンレム睡眠に分けられる","コルチゾールは血糖値の調節などに働き、分泌量は明け方から増え、起床前後で最大になる","レム睡眠は安らかな眠りで、この間は脳が休んでいる","メラトニンは、睡眠に関わるホルモン"],4,"S_suimin"]
]});
R.push({id:"2022-04",label:"2022年4月公表",q:[

[17,"脳血管疾患・虚血性心疾患について、誤っているものは？",["脳梗塞は、脳血管自体の動脈硬化による脳塞栓症と、心臓等の血栓が剥がれて詰まる脳血栓症に分類される","高血圧性脳症は、急激な血圧上昇で脳が腫れ、頭痛・嘔吐・意識障害・けいれん等が出る","虚血性心疾患は、冠動脈からの心筋への血液供給が不足・途絶して起こる","虚血性心疾患は、可逆的な狭心症と、不可逆的な壊死が起こる心筋梗塞に大別される","運動負荷心電図検査は、虚血性心疾患の発見に有用"],1,"E_noushin"],

L_kenshin_item:{t:"定期健診で省略できる？",p:6,l:["必ずやる（省略 ✕）：既往歴・業務歴／自覚・他覚症状／体重／視力／聴力／血圧／尿（糖・蛋白）","医師が不要と認めれば省略 ○：身長／腹囲／胸部X線／貧血／肝機能／血中脂質／血糖／心電図","覚え方：問診＋はかるだけ＋尿＝必ずやる、血液・画像・心電図は省略できる","聴力検査　[[1,000Hz ＋ 4,000Hz]]　雇入時は年齢を問わずこの2つ","2027年4月からの改正：✕ 喀痰検査 削除／肝機能：GOT・GPT・γ-GTP → AST・ALT・γ-GT／＋ 血清クレアチニンを追加（40歳未満は省略可）"],h:["尿検査で「馬尿酸」を調べる → ✕（尿中の糖と蛋白）"]},
L_stress:{t:"ストレスチェック",p:7,l:["[[50人以上]]・[[1年に1回]]（50人未満は努力義務）","▼ 結果は本人へ直接（同意なく事業者・衛生管理者に渡さない）","▼ 高ストレス＋本人の申出（「全員に」ではない）","▼ 医師の面接指導：申出から[[1か月以内]]","▼ 医師の意見を聴く：面接後[[1か月以内]]","▼ 記録を[[5年]]保存。労基署へ年1回報告","検査の3領域：心理的な負担の原因／心身の自覚症状／周りの人からの支援"],h:["面接指導の医師は「研修修了者に限る」→ ✕（要件なし）","面接指導の結果を集団分析 → ✕（集団分析は検査結果）","面接指導の結果を健康診断個人票に記載 → ✕"]},
L_choujikan:{t:"長時間労働の面接指導",p:7,l:["時間外・休日 [[月80時間超]]＋疲労の蓄積","▼ 本人の申出（「100時間超は申出不要」は研究開発業務だけ）","▼ 医師の面接指導：遅滞なく・産業医以外の医師でもよい","▼ 医師の意見を聴く：[[遅滞なく]]（3か月以内 ✕）","▼ 記録を[[5年]]保存","労働時間の記録は[[3年]]・管理監督者も把握"]},
L_jisshisha:{t:"ストレスチェックの実施者",p:7,l:["○ 医師・保健師・歯科医師・看護師・精神保健福祉士・公認心理師（研修修了が必要）","✕ 衛生管理者　✕ 労働衛生コンサルタント　✕ 産業カウンセラー","人事権のある監督者は実施の事務もできない"]},
L_hozon:{t:"記録の保存年数",p:7,l:["[[5年]]：健康診断個人票／面接指導の記録（長時間・ストレス）","[[3年]]：産業医の勧告・委員会の議事／労働時間の状況・空気環境の測定","覚え方：個人の健康の記録は5年、それ以外は3年"]},
L_sagyoba:{t:"作業場の基準",p:8,l:["作業場　1人 [[10m³]] 以上（設備を除き、床から[[4m]]までで計算）","窓 [[1/20]] 以上：開けられる窓が床面積の1/20以上なら換気設備は不要（1/25 ✕・1/15 ○）","照度　精密[[300]]・普通[[150]]・粗[[70]] lx（基準より明るいのは違反ではない）","計算例：容積150m³・設備55m³ → (150−55)÷10＝9.5 → 9人"],h:["「床から3mを超える部分を除き40人で400m³」→ それでも10m³/人あるので違反ではない"]},
L_shisetsu:{t:"休養室・食堂・炊事場・便所・大掃除",p:8,l:["休養室（臥床できる・男女別）：[[50人以上]] または [[女性30人以上]]のとき。合計30人（女性25人）なら設置義務なし","食堂：1人 [[1m²]] 以上（0.5m²・0.8m²は違反）","炊事場：土足 ✕（洗浄剤マットを置いても ✕）","便所（何人ごとに1個）：男大60・男小[[30]]・女20（小便所50人に1個は違反）","大掃除・ねずみ昆虫の調査：[[6か月ごと]]（「1年に1回」は違反）"]},
L_air:{t:"事務室の空気（空調・機械換気があるとき）",p:8,l:["二酸化炭素 [[1,000ppm]] 以下／一酸化炭素 [[10ppm]] 以下","気流 [[0.5m/s]] 以下／室温 [[18〜28℃]]／相対湿度 [[40〜70%]]","浮遊粉じん [[0.15mg/m³]] 以下／ホルムアルデヒド [[0.1mg/m³]] 以下","測定の頻度：中央管理方式の空調は[[2か月ごと]]・記録3年","測定の位置：室の中央・床上[[75〜150cm]]","測定器：CO・CO₂＝検知管／温度・湿度＝0.5度目盛"],h:["測定位置を「床上150cmの位置」と1点に限る → ✕"]},
L_tenken:{t:"点検・清掃のカレンダー",p:9,l:["毎日：燃焼器具の点検","1か月：冷却塔・冷却水／加湿装置／排水受け","2か月：機械換気設備の点検／空気環境の測定","6か月：照明設備の点検／大掃除／ねずみ・昆虫の調査","1年：冷却塔・水管・加湿装置の清掃","覚え方：燃焼は毎日・水まわり1か月・換気2か月・照明と掃除6か月・清掃1年"]},
L_nenkyu:{t:"年次有給休暇",p:9,l:["週30時間以上？ はい →「通常」の行／いいえ → 週の日数の行（週4日以下のときだけ比例付与）","勤続：6か月／1年6か月／2年6か月／3年6か月／4年6か月／5年6か月／6年6か月〜","通常（週30時間以上 or 週5日以上）：10・11・12・14・16・18・20","週4日（週30時間未満）：7・8・9・10・12・13・15","週3日：5・6・6・8・9・10・11","週2日：3・4・4・5・6・6・7","週1日：1・2・2・2・3・3・3","表を忘れたら：通常の日数 × 週の日数 ÷ 5.2（端数は切り捨て）。例：3年6か月・週4日　14×4÷5.2＝10.7 → 10日","時効は[[2年]]／計画的付与は[[5日を超える部分]]／育児・介護休業は[[出勤扱い]]"],h:["週30時間・週32時間で週4日 → 比例付与ではなく「通常」の行（2024年に2回出題）","時効1年 ✕、計画的付与「3日を超える部分」✕、育休を「全労働日から除外」✕"]},
L_jikan:{t:"労働時間",p:10,l:["休憩：6時間まで休憩なしでも可／6時間超 [[45分]]／8時間超 [[60分]]（「12時間超で90分」という規定はない）","36協定の上限　原則：月[[45h]]・年[[360h]]　特別条項：月[[100h未満]]・年[[720h]]（月100hは時間外＋休日、年720hは時間外のみ）","労働時間・休憩・休日の規定が外れる人　許可不要：管理監督者・機密の事務／労基署長の許可：監視・断続的労働（年次有給休暇は外れない）","フレックスの清算期間は[[3か月以内]]／事業場が違っても労働時間は[[通算]]／時間外・休日の禁止は[[18歳未満]]"],h:["休憩「8時間超で45分」→ ✕（60分）","時間外の禁止を「20歳未満」→ ✕（18歳未満）"]},
L_ninsanpu:{t:"妊産婦・育児",p:10,l:["産前6週（多胎14週）請求したら休業／産後[[8週]] 就業禁止（6週後は本人請求＋医師OKで可）／産後1年まで「妊産婦」","妊産婦が請求したら：変形労働時間制（1か月・1年単位）→ 1日8h・週40hを超えられない／フレックスタイム制 → [[制限なし]]","時間外・休日・深夜 → させられない（管理監督者は深夜のみ）","軽易な業務への転換 → 妊娠中の女性が請求","生理休暇 → 就業させてはならない","育児時間：生後1年未満の子を育てる女性　1日[[2回]]・各[[30分]]以上　[[男性は対象外]]　無給でよい"],h:["フレックスでも妊産婦は8時間超 ✕ → 誤り（フレックスは制限なし）"]},
E_kanki:{t:"換気（必要換気量）",p:11,l:["Q（m³/h）＝ 全員が1時間に吐くCO₂量（m³/h）÷（基準 1,000ppm − 外気 400ppm）× 1,000,000","濃度を％で書くときは ×100（基準0.1%・外気0.04%）。分母に室内の「測定値」は使わない","型1：何人まで入れる？　換気量600 × 濃度差600 ÷ 1,000,000 ＝ [[0.36 m³/h]]（全員で吐いてよい量）÷ 1人分 → 0.018なら20人・0.016なら22人・0.015なら24人","型2：換気量はいくら？　11人 × 0.02 ＝ 0.22 m³/h → 0.22 ÷ 600 × 1,000,000 ≒ [[370 m³/h]]","外気の酸素 [[21%]]／外気のCO₂ [[0.04%]]（0.3〜0.4% ✕）／呼気の酸素 [[16%]]／呼気のCO₂ [[4%]]"],h:["外気のCO₂「0.3〜0.4%」、基準「1%」→ どちらも桁違い ✕"]},
E_wbgt:{t:"WBGT・温熱",p:11,l:["WBGT（暑さ指数）は「7・2・1」","日射あり：0.7×自然湿球温度＋0.2×黒球＋0.1×乾球","日射なし：0.7×自然湿球温度＋0.3×黒球（日射なしは乾球（気温）が消える。式に「気流」は入らない。単位は℃）","体への負荷が大きい → 基準値は[[小さく]]／暑熱順化している → 基準値は[[大きく]]","熱中症のリスク：WBGT値が基準値を[[超える]]","温度感覚の4要素：気温・湿度・気流・ふく射熱。実効温度はふく射熱を除く3つ","熱中症はⅢ度が最重症／相対湿度＝水蒸気量÷飽和水蒸気量×100"],h:["温度感覚は「3要素」→ ✕（4要素）","WBGT値が基準値「未満」で危険 → ✕"]},
E_shomei:{t:"照明",p:12,l:["光源と視線の角度は[[30°以上]]","上：明るい色／下（目の高さ以下）：濁色（まぶしさ防止）","全般照明は局部照明の [[1/10以上]]（1/5程度が目安）","1lx＝1cdの光源から1m／照明の点検は[[6か月ごと]]","北向きの窓＝一年中平均した明るさ／高齢者は高照度・まぶしさ注意／全方向から同じ明るさ＝立体感がない"]},
E_toukei:{t:"統計",p:12,l:["スクリーニングは「行」で割る","例：疾病あり 陽性35・陰性10（行の合計45）／疾病なし 陽性160・陰性795（行の合計955）","偽陽性率＝160÷955＝[[16.8%]]　偽陰性率＝10÷45＝[[22.2%]]","有所見率：ある時点の割合＝静態データ ⇔ 発生率：一定期間の割合＝動態データ","計数データ：人数など ⇔ 計量データ：身長・体重など","ばらつき＝[[分散・標準偏差]]（平均値・中央値・最頻値 ✕）　相関があっても因果関係とは限らない"]},
E_bmi:{t:"BMI・メタボ・検査値",p:12,l:["BMI ＝ 体重(kg) ÷ 身長(m)²　男女同じ基準・腹囲や体脂肪率は使わない","18.5未満 低体重／18.5〜25 普通体重／25以上 肥満　[[22]]＝標準体重　例 26（175cm・80kg）","メタボの診断：腹囲 男[[85cm]]・女[[90cm]]以上 ＋ 脂質・血圧・空腹時血糖のうち[[2つ以上]]","検査値：HDLは低いと危険／γ-GTP＝アルコール／HbA1c＝1〜2か月の血糖／BUN高い＝腎機能低下"]},
E_shokuchu:{t:"食中毒",p:13,l:["感染型：サルモネラ菌（鶏卵・食肉。腸管内で増える）／腸炎ビブリオ（魚介類・病原性好塩菌・[[熱に弱い]]）／カンピロバクター（鶏肉。細菌（カビ ✕））／O-157・O-111（ベロ毒素・出血性下痢・潜伏期間3〜5日）","毒素型＝「ボ・ブ」：ボツリヌス菌（缶詰・真空パック・神経毒で麻痺）／黄色ブドウ球菌（毒素エンテロトキシン・[[熱に強い]]）。フグ毒はテトロドトキシン","ウイルス：ノロウイルス（[[冬]]に多い・潜伏[[1〜2日]]・食品中では増えない・煮沸・塩素系が有効）","化学性：ヒスタミン（赤身魚・チーズ・[[加熱で分解されない]]）"]},
E_noushin:{t:"脳と心臓の病気",p:13,l:["「血栓」は血管そのもの、「塞栓」は流れてきた","出血性：くも膜下出血（脳動脈瘤が破れ、[[突然]]の激しい頭痛（数日後 ✕））／脳出血（脳の実質の中に出血）","虚血性（脳梗塞）：[[脳血栓症]]（脳の血管そのものが動脈硬化で詰まる）／[[脳塞栓症]]（心臓などの血栓が流れてきて詰まる）","虚血性心疾患：[[冠動脈]]の血流不足","狭心症：一時的・回復する。発作は数分〜15分以内／心筋梗塞：心筋が壊死（不可逆）。激しい胸痛が1時間以上も"],h:["脳血栓症と脳塞栓症の説明を入れ替え（5年で4回）","虚血性心疾患は「門脈」の血流不足 → ✕（冠動脈）","運動負荷心電図は虚血性心疾患の発見に「有用でない」→ ✕"]},
E_joho:{t:"情報機器作業",p:14,l:["画面の上端は眼よりやや下／視距離[[40cm以上]]","書類・キーボード上 [[300lx以上]]／画面上 [[500lx以下]]","連続作業 [[1時間以内]]（途中に小休止1〜2回）▼ 作業休止 [[10〜15分]]（5分 ✕）","健診：配置前＋1年ごと。1日4時間未満の人は自覚症状がある人だけ"]},
E_youtsu:{t:"腰痛予防",p:14,l:["男性 体重の[[40%]]以下／女性 男性が扱える重量の[[60%]]位","健診：配置前 ＋ [[6か月ごと]]（50% ✕・1年ごと ✕）","配置前健診の項目 ○：既往歴・業務歴／自覚症状／脊柱の検査／神経学的検査","誤り：✕ 負荷心電図　✕ 腰部保護ベルトを全員に　✕ 作業標準は不適切","持ち上げ：片足を前・膝を曲げて腰を落とす／立ち作業：クッション性のある靴"]},
E_kitsuen:{t:"受動喫煙防止",p:14,l:["第一種施設（学校・病院・行政機関）：原則[[敷地内禁煙]]。屋外の喫煙場所は設置できる（「一切 ✕」は誤り）","第二種施設（事務所・工場・飲食店）：原則[[屋内禁煙]]。喫煙専用室なら可。時間分煙は ✕","喫煙専用室の条件：出入口の気流[[0.2m/s以上]]／壁・天井で区画／屋外へ排気／標識を掲示","専用室でできない：✕ 飲食（飲み物も）","指針にない：✕ 6か月ごとの気流測定　✕ 計画の届出"]},
E_mental:{t:"メンタルヘルス：4つのケア",p:15,l:["セルフケア／ラインによるケア／事業場内産業保健スタッフ等によるケア／事業場外資源によるケア（「家族によるケア」は含まれない）","一次予防：不調を未然に防ぐ／二次予防：早く見つけて対応／三次予防：職場復帰の支援","心の健康づくり計画は[[衛生委員会で審議]]（避ける ✕）。人事労務部門と連携する。"]},
E_thp:{t:"健康保持増進（THP）",p:15,l:["健康測定（[[健診結果も活用できる]] ○）▶ 健康指導（運動・メンタル・栄養・口腔・保健）▶ 医療保険者と連携（[[健診データの提供もできる]] ○）","運動機能検査の組合せ：筋力 → 握力／柔軟性 → 座位体前屈／筋持久力 → 上体起こし／敏しょう性 → 全身反応時間／平衡性 → 閉眼片足立ち／全身持久性 → 最大酸素摂取量","「敏しょう性＝踏み台昇降」は誤り"]},
E_3kanri:{t:"労働衛生の3管理・その他の指針",p:15,l:["作業環境管理：照度の調整・空調で室温調節","作業管理：[[作業姿勢]]・[[暑熱順化期間]]・作業時間","健康管理：健康診断・腰痛予防体操","快適職場：✕ 基準値の達成（考慮：継続的・計画的、意見の反映、個人差、潤い）","安全衛生マネジメント：✕ 外部機関の監査が義務（方針表明・目標・計画・内部監査）","高年齢労働者：✕ 担当者を置かない ✕ 警報は高音域 ✕ 教育は最小限／[[経営トップが方針を表明]] ○"]},
E_bls:{t:"一次救命処置（BLS）",p:16,l:["1 応援とAED：1人でやらない","2 呼吸を見る：10秒以内・分からなければ心停止とみなす","3 胸骨圧迫：胸の[[下半分]]・約[[5cm]]・[[100〜120回/分]]","4 人工呼吸：圧迫30回：呼吸2回","5 AEDのあと：すぐ胸骨圧迫を再開"]},
E_kossetsu:{t:"骨折",p:16,l:["単純骨折：皮膚に傷がない（「ひび」✕）","複雑骨折＝開放骨折：皮膚が破れる・感染しやすい","不完全骨折：ひびが入った状態","完全骨折：軋轢音・変形がある","副子は[[上下の関節まで・幅広]]／動かして確かめない／脊髄損傷は[[硬い板]]で運ぶ"]},
E_shukketsu:{t:"出血",p:16,l:["全血液量 [[8%]]（体重の約1/13）／[[1/3]]を急に失うと命に関わる","静脈性出血：じわじわ湧き出る ⇔ 毛細血管性出血：にじみ出る（[[擦り傷]]）","止血は直接圧迫法が基本。間接圧迫法は心臓に近い動脈を押さえる。"]},
E_kansen:{t:"感染症",p:16,l:["[[日和見感染]]：抵抗力が落ちて、普段は無害な病原体で発症 ⇔ [[不顕性感染]]：感染しても症状が出ない","[[飛沫感染]]：咳・くしゃみ（インフルエンザ・風邪） ⇔ [[空気感染]]：5µm以下の粒子が長時間浮遊","インフルエンザの流行はA型・B型／結核は2週間以上の咳／風しんは妊娠初期で先天性風しん症候群"]},

function kindOf(h){
  if(h.includes("\n")||/近似値|最も近い|日数は|人数は|業種は/.test(h)) return null;
  if(/男女差がない/.test(h)) return {ans:"o",o:"男女差なし",x:"男女差あり"};
  if(/違反しているものは/.test(h)) return {ans:"x",o:"違反なし",x:"違反"};
  if(/違反していないものは/.test(h)) return {ans:"o",o:"違反なし",x:"違反"};
  if(/誤っているものは/.test(h)) return {ans:"x",o:"正しい記述",x:"誤りの記述"};
  if(/正しいものは/.test(h)) return {ans:"o",o:"正しい記述",x:"誤りの記述"};
  if(/適切でないものは/.test(h)) return {ans:"x",o:"適切",x:"不適切"};
  if(/適切なものは/.test(h)) return {ans:"o",o:"適切",x:"不適切"};
  if(/定められていないものは/.test(h)) return {ans:"x",o:"定めあり",x:"定めなし"};
  if(/該当しないものは|とされていないものは/.test(h)) return {ans:"x",o:"該当する",x:"該当しない"};
  return null;
}

/* hanamaru path */
const HANA=(()=>{let p=[];const turns=2.55,end=Math.PI*2*turns;
  for(let t=0;t<=end+.001;t+=.16){const r=2.5+t*2.42;p.push((50+r*Math.cos(t-1.3)).toFixed(1)+" "+(50+r*Math.sin(t-1.3)).toFixed(1))}
  let d="M"+p.join("L");const Rr=2.5+end*2.42,n=9,a0=end-1.3;
  for(let i=0;i<n;i++){const a1=a0+i*2*Math.PI/n,a2=a1+2*Math.PI/n,cm=a1+Math.PI/n;
    d+="Q"+(50+(Rr+19)*Math.cos(cm)).toFixed(1)+" "+(50+(Rr+19)*Math.sin(cm)).toFixed(1)+" "+(50+Rr*Math.cos(a2)).toFixed(1)+" "+(50+Rr*Math.sin(a2)).toFixed(1)}
  return d})();

function gaugeRow(name,cls,t,cut){
  return `<div class="g-row ${cls}"><span class="g-name">${name}</span>
    <span class="g-bar" role="img" aria-label="${name} 正答率 ${t.rate==null?"未回答":t.rate+"%"}"><span class="g-fill" style="width:${t.rate||0}%"></span><span class="g-cut" style="left:${cut}%"></span></span>
    <span class="g-num">${t.rate==null?"—":t.rate+"%"}</span><span class="g-sub">${t.done}/${t.total}問 解答済み</span></div>`;
}
function weakTopics(){
  return TAGS.map(t=>({t,s:statsOf(TAGQ[t])})).filter(o=>o.s.done>=2&&o.s.rate<=60).sort((a,b)=>a.s.rate-b.s.rate||b.s.done-a.s.done).slice(0,3);
}

/* ================= question card ================= */
function stemHTML(q){
  const [head,...rest]=q.stem.split("\n");
  return `<p class="stem">${esc(head).replace(KW,"<mark>$1</mark>")}</p>${rest.length?`<div class="given">${rest.map(l=>`<div>${esc(l)}</div>`).join("")}</div>`:""}`;
}
function cardHTML(q,st,o){
  o=o||{}; const sj=SUBJ[q.s], k=q.kind, done=!!st.done;
  const rows=q.ch.map((c,i)=>{const n=i+1, el=st.elim.includes(n), sel=st.pick===n, isA=n===q.ans;
    let cls="row"+(el?" elim":"")+(sel?" sel":""), tags="";
    if(done){
      if(isA){cls+=" isans";tags+=`<span class="tg a">正解</span>`}
      if(sel)tags+=`<span class="tg m">あなたの解答</span>`;
      if(isA&&el)tags+=`<span class="tg">消していた</span>`;
      if(k){const t=isA?k.ans:(k.ans==="o"?"x":"o");tags+=`<span class="tg ${t==="x"?"tx":""}">${t==="o"?"○":"✕"} ${k[t]}</span>`}
    }
    return `<li class="${cls}" data-n="${n}">
      <button class="num" data-act="pick" data-n="${n}" aria-label="${n}番を解答にする" aria-pressed="${sel}"><span class="bub">${n}</span></button>
      <button class="txt" data-act="elim" data-n="${n}" aria-pressed="${el}"><span class="ct">${esc(c)}</span>${tags?`<span class="tags">${tags}</span>`:""}</button></li>`}).join("");
  let mk="";
  if(done&&!o.nomark) mk=st.pick===q.ans?hanaSVG:batsuSVG;
  return `<article class="qcard${done?" done":""}${entering?" enter":""}">
    <div class="qtag ${sj.c}">${sj.name}<em>${o.no?`問${o.no}　`:""}${q.label}${o.no?"":"　問"+q.n}</em></div>
    ${stemHTML(q)}${mk}
    ${done?"":`<p class="hint"><span><i>1</i>番号をタップで解答</span><span><s>文をタップ</s>で消去線</span></p>`}
    <ol class="rows">${rows}</ol></article>`;
}
function noteBlock(id){
  const b=N[id]; if(!b) return "";
  return `<section class="nb ${SUBJ[id[0]].c}"><header><span class="sj">${SUBJ[id[0]].name}</span><h4>${esc(b.t)}</h4><span class="pg">ノート p.${b.p}</span></header>
    <ul>${b.l.map(l=>`<li>${fmt(l)}</li>`).join("")}</ul>
    ${b.h?`<div class="trap"><b>ひっかけ</b><ul>${b.h.map(l=>`<li>${fmt(l)}</li>`).join("")}</ul></div>`:""}</section>`;
}
function explHTML(q,st){
  const ok=st.pick===q.ans, k=q.kind;
  return `<div class="expl" id="expl">
    <div class="verdict"><b class="${ok?"ok":""}">${ok?"正解":st.pick?"不正解":"未解答"}</b><span>正解は（${q.ans}）</span></div>
    ${k?`<div class="legend">各選択肢の ○ は「${k.o}」、✕ は「${k.x}」です。</div>`:""}
    ${q.tags.map(noteBlock).join("")}
    ${q.x?`<div class="extra"><div class="lb">補足（ノート外）</div>${esc(q.x)}</div>`:""}</div>`;
}
function topBar(o){
  return `<div class="top"><div class="in">
    <button class="x" data-act="${o.close}" aria-label="${o.closeLabel||"閉じる"}">${o.back?IC.back:IC.x}</button>
    <div class="meta"><b>${o.title}</b>${o.sub||""}</div>${o.right||""}${IC.tt}</div>
    <div class="prog"><i style="width:${Math.round((o.prog||0)*100)}%"></i></div></div>`;
}
function markBtn(id){return `<button class="sq" data-act="mark" aria-pressed="${!!store.marks[id]}" aria-label="付箋を付ける">${IC.flag}</button>`}
function curSt(){return view==="quiz"?P.st:view==="exam"?X.st[X.i]:null}
function syncRows(st){
  document.querySelectorAll(".row").forEach(li=>{const n=+li.dataset.n, s=st.pick===n, e=st.elim.includes(n);
    li.classList.toggle("sel",s); li.classList.toggle("elim",e);
    li.querySelector(".num").setAttribute("aria-pressed",s); li.querySelector(".txt").setAttribute("aria-pressed",e)});
  const g=document.getElementById("grade"); if(g)g.disabled=!st.pick;
  const c=document.getElementById("xcount"); if(c&&X)c.textContent=X.st.filter(s=>s.pick).length+"/30";
}

/* ================= practice ================= */
function startQuiz(o){
  o=o||{}; let list,title;
  if(o.tag){list=smartOrder(TAGQ[o.tag]);title="テーマ："+N[o.tag].t}
  else{const p=pool(), m=store.set.mode; const seq=store.set.order==="seq", nm=(MODES.find(x=>x[0]===m)||MODES[0])[1]; list=seq?p:(m==="smart"?smartOrder(p):shuffle(p)); title=seq?(m==="smart"||m==="all"?"問題順":nm+"・問題順"):nm}
  if(!list.length)return;
  P={bag:list,i:0,title,tag:o.tag||null,sess:{n:0,ok:0,streak:0},st:{pick:0,elim:[],done:false}};
  go("quiz");
}
function renderQuiz(){
  const q=P.bag[P.i], st=P.st, s=P.sess;
  const right=`<div class="score">${s.ok}<span> / ${s.n} 正解</span>${s.streak>=3?`<span class="stk">${s.streak}問連続</span>`:""}</div>`;
  const bar=st.done
    ?`<div class="bar"><div class="in">${markBtn(q.id)}<button class="go" data-act="next">${P.i+1<P.bag.length?"次の問題":"結果を見る"}</button></div></div>`
    :`<div class="bar"><div class="in">${markBtn(q.id)}<button class="ghost" data-act="giveup">わからない</button><button class="go" id="grade" data-act="grade" ${st.pick?"":"disabled"}>解答する</button></div></div>`;
  app.innerHTML=topBar({close:"home",closeLabel:"ホームに戻る",title:`${P.i+1}問目 / ${P.bag.length}問`,sub:esc(P.title),right,prog:(P.i+(st.done?1:0))/P.bag.length})
    +`<div class="wrap quiz">${cardHTML(q,st)}${st.done?explHTML(q,st):""}</div>`+bar;
}
function grade(giveup){
  const q=P.bag[P.i], st=P.st; if(st.done)return; if(giveup)st.pick=0; else if(!st.pick)return;
  st.done=true; const ok=st.pick===q.ans; P.sess.n++; if(ok){P.sess.ok++;P.sess.streak++}else P.sess.streak=0;
  record(q,ok); save();
  const y=window.scrollY; renderQuiz(); window.scrollTo(0,y);
  const ex=document.getElementById("expl");
  if(ex){const r=ex.getBoundingClientRect(); if(r.top>window.innerHeight-150) window.scrollBy({top:r.top-window.innerHeight+210,behavior:reduced()?"auto":"smooth"})}
}
function nextQ(){P.i++; if(P.i>=P.bag.length){go("done");return} P.st={pick:0,elim:[],done:false}; go("quiz")}
function renderDone(){
  const s=P.sess, rate=s.n?Math.round(s.ok/s.n*100):0;
  app.innerHTML=topBar({close:"home",closeLabel:"ホームに戻る",title:"おつかれさまでした",sub:esc(P.title),prog:1})+`<div class="wrap quiz"><div class="res">
    ${rate>=60?hanaSVG:""}<h2>この範囲をひと通り解きました</h2>
    <div class="big">${s.ok}<small> / ${s.n}</small></div><p>正答率 ${rate}%（合格の目安は60%以上）</p></div></div>
    <div class="bar"><div class="in"><button class="ghost" data-act="home">ホーム</button><button class="go" data-act="again">もう一周</button></div></div>`;
}

/* ================= exam ================= */
function newExam(){
  let ids=[]; SK.forEach(s=>{ids=ids.concat(shuffle(Q.filter(q=>q.s===s)).slice(0,10).map(q=>q.id))});
  store.exam={ids,st:ids.map(()=>({pick:0,elim:[],flag:false})),i:0,left:LIMIT}; save(); resumeExam();
}
function resumeExam(){X=store.exam; if(!X)return; go("exam"); startTick()}
function startTick(){stopTick(); tick=setInterval(()=>{
  if(view!=="exam"||!X||document.hidden)return; X.left--;
  const el=document.getElementById("timer"); if(el){el.textContent=fmtT(X.left);el.classList.toggle("low",X.left<600)}
  if(X.left%15===0)save(); if(X.left<=0)finishExam(true)},1000)}
function stopTick(){if(tick){clearInterval(tick);tick=null}}
function renderExam(){
  const q=QBY[X.ids[X.i]], st=X.st[X.i], n=X.st.filter(s=>s.pick).length, last=X.i===29;
  app.innerHTML=topBar({close:"x-quit",closeLabel:"模擬試験を中断",title:`模擬試験　問${X.i+1} / 30`,sub:SUBJ[q.s].name,
      right:`<div class="timer${X.left<600?" low":""}" id="timer" aria-label="残り時間">${fmtT(X.left)}</div>`,prog:n/30})
    +`<div class="wrap quiz">${cardHTML(q,st,{no:X.i+1})}</div>
    <div class="bar"><div class="in"><button class="sq" data-act="x-flag" aria-pressed="${!!st.flag}" aria-label="あとで見直す印を付ける">${IC.flag}</button>
      <button class="ghost" data-act="x-prev" ${X.i?"":"disabled"}>前へ</button>
      <button class="ghost" data-act="x-sheet">一覧 <span class="num-t" id="xcount">${n}/30</span></button>
      <button class="go" data-act="${last?"x-sheet":"x-next"}">${last?"採点へ":"次へ"}</button></div></div>`;
}
function sheetHTML(){
  const un=X.st.filter(s=>!s.pick).length;
  const g=SK.map((s,gi)=>`<div class="ms-g"><div class="mh ${SUBJ[s].c}">${SUBJ[s].name}</div><div class="ms">${
    Array.from({length:10},(_,j)=>{const i=gi*10+j,st=X.st[i];return `<button data-act="x-jump" data-i="${i}" class="${st.pick?"f":""}${st.flag?" fl":""}${i===X.i?" cur":""}" aria-label="問${i+1}${st.pick?" 解答済み":" 未解答"}${st.flag?" 見直し印あり":""}">${i+1}</button>`}).join("")}</div></div>`).join("");
  return `<div class="scrim" data-act="m-close"></div><div class="sheet" role="dialog" aria-label="マークシート">

    <div class="in"><button class="ghost" data-act="m-close">戻る</button><button class="go" data-act="x-finish">採点する</button></div></div>`;
}
function finishExam(timeout){
  stopTick(); closeModal();
  const ok=X.ids.map((id,i)=>{const q=QBY[id],r=X.st[i].pick===q.ans;record(q,r);return r});
  const sc={L:0,E:0,S:0}; X.ids.forEach((id,i)=>{if(ok[i])sc[QBY[id].s]++});
  const total=sc.L+sc.E+sc.S, pass=sc.L>=4&&sc.E>=4&&sc.S>=4&&total>=18;
  RES={ids:X.ids,st:X.st.map(s=>({pick:s.pick,elim:s.elim,done:true})),ok,sc,total,pass,used:LIMIT-X.left,timeout:!!timeout};
  store.exams.unshift({t:Date.now(),L:sc.L,E:sc.E,S:sc.S,total,pass,used:RES.used}); store.exams=store.exams.slice(0,20);
  store.exam=null; X=null; save(); go("result");
}

  const r=RES, why=[]; SK.forEach(s=>{if(r.sc[s]<4)why.push(SUBJ[s].name+"が4問未満")}); if(r.total<18)why.push("合計が18問未満");
  const g=SK.map((s,gi)=>`<div class="ms-g"><div class="mh ${SUBJ[s].c}">${SUBJ[s].name}<span class="${r.sc[s]<4?"ng":""}">${r.sc[s]} / 10</span></div><div class="ms ${SUBJ[s].c}">${

      ${r.pass?`<p>各科目4問以上・合計18問以上を満たしました。</p>`:`<p class="why">${why.join("、")}</p>`}
      ${g}<p style="margin-top:14px;font-size:12.5px">マスをタップすると、その問題の解説を開きます。</p></div></div>

let onOk=null;
function closeModal(){modalEl.innerHTML="";onOk=null}
function ask(o,cb){onOk=cb;
  modalEl.innerHTML=`<div class="scrim" data-act="m-close"></div><div class="dlg" role="alertdialog" aria-label="${esc(o.title)}"><h3>${esc(o.title)}</h3><p>${esc(o.body||"")}</p>

/* ================= events ================= */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]"); if(!t||t.disabled) return;
  const a=t.dataset.act, st=store.set;
  switch(a){
    case "theme": toggleTheme(t); break;
    case "tab": tab=t.dataset.v; renderHome(); window.scrollTo(0,0); break;
    case "subj": {const s=t.dataset.v; st.subj[s]=!st.subj[s]; if(!SK.some(k=>st.subj[k]))st.subj[s]=true; save(); renderHome(); break}
    case "round": {const r=t.dataset.v, sc=document.querySelector(".rounds"), x=sc?sc.scrollLeft:0;
      if(r==="*")st.rounds=[]; else{const i=st.rounds.indexOf(r); if(i>=0)st.rounds.splice(i,1); else st.rounds.push(r)}
      save(); renderHome(); const s2=document.querySelector(".rounds"); if(s2)s2.scrollLeft=x; break}
    case "mode": st.mode=t.dataset.v; save(); renderHome(); break;
    case "order": st.order=t.dataset.v; save(); renderHome(); break;
    case "start": startQuiz(); break;
    case "topic": startQuiz({tag:t.dataset.tag}); break;
    case "note": {const g=t.dataset.tag; openTag=openTag===g?null:g; renderHome(); const el=document.getElementById("nt-"+g); if(el&&openTag){const r=el.getBoundingClientRect(); if(r.top<70||r.top>innerHeight*0.6)window.scrollBy({top:r.top-72,behavior:reduced()?"auto":"smooth"})} break}
    case "reset": ask({title:"解答記録を消しますか？",body:"正答率、付箋、模試の記録がすべて消えます。元には戻せません。",ok:"消す",danger:true},()=>{store.hist={};store.marks={};store.exams=[];store.exam=null;save();renderHome()}); break;
    case "home": stopTick(); go("home"); break;
    case "pick": {const s=curSt(); if(!s||s.done)break; const n=+t.dataset.n; if(s.pick===n)s.pick=0; else{s.pick=n; const i=s.elim.indexOf(n); if(i>=0)s.elim.splice(i,1)} syncRows(s); if(view==="exam")save(); break}
    case "elim": {const s=curSt(); if(!s||s.done)break; const n=+t.dataset.n, i=s.elim.indexOf(n); if(i>=0)s.elim.splice(i,1); else{s.elim.push(n); if(s.pick===n)s.pick=0} syncRows(s); if(view==="exam")save(); break}
    case "grade": grade(false); break;
    case "giveup": grade(true); break;
    case "next": nextQ(); break;
    case "again": startQuiz(P&&P.tag?{tag:P.tag}:undefined); break;
    case "mark": {const id=view==="quiz"?P.bag[P.i].id:RES.ids[V]; if(store.marks[id])delete store.marks[id]; else store.marks[id]=1; save(); t.setAttribute("aria-pressed",!!store.marks[id]); break}
    case "x-new": if(store.exam)ask({title:"新しい模擬試験を始めますか？",body:"途中の模擬試験は破棄されます。",ok:"新しく始める"},newExam); else newExam(); break;
    case "x-resume": resumeExam(); break;
    case "x-prev": if(X.i>0){X.i--;save();go("exam")} break;
    case "x-next": if(X.i<29){X.i++;save();go("exam")} break;
    case "x-flag": {const s=X.st[X.i]; s.flag=!s.flag; save(); t.setAttribute("aria-pressed",s.flag); break}
    case "x-sheet": modalEl.innerHTML=sheetHTML(); break;
    case "x-jump": X.i=+t.dataset.i; save(); closeModal(); go("exam"); break;
    case "x-finish": {const un=X.st.filter(s=>!s.pick).length;
      ask({title:"採点しますか？",body:un?`未解答が${un}問あります。未解答は不正解として採点します。`:"採点すると解答は変更できません。",ok:"採点する",cancel:"戻る"},()=>finishExam(false)); break}
    case "x-quit": ask({title:"模擬試験を中断しますか？",body:"解答と残り時間は保存され、「模擬試験」タブから再開できます。",ok:"中断する",cancel:"続ける"},()=>{save();stopTick();tab="exam";go("home")}); break;
    case "r-open": V=+t.dataset.i||0; go("review"); break;
    case "r-back": go("result"); break;
    case "v-prev": if(V>0){V--;go("review")} break;
    case "v-next": if(V<29){V++;go("review")} break;
    case "m-close": closeModal(); break;
    case "m-ok": {const f=onOk; closeModal(); if(f)f(); break}
  }
});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&X)save()});

/* ================= theme ================= */
const BG={light:"#EDF0F3",dark:"#111419"};
const curTheme=()=>document.documentElement.getAttribute("data-theme")==="dark"?"dark":"light";
function applyTheme(t){
  document.documentElement.setAttribute("data-theme",t);
  const m=document.getElementById("themeColor"); if(m)m.setAttribute("content",BG[t]);
  try{localStorage.setItem("eisei2-theme",t)}catch(e){}
}
function toggleTheme(btn){
  const next=curTheme()==="dark"?"light":"dark";
  const r=btn.getBoundingClientRect(), x=r.left+r.width/2, y=r.top+r.height/2;
  const end=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));
  const clip=[`circle(0px at ${x}px ${y}px)`,`circle(${end}px at ${x}px ${y}px)`];
  if(reduced()){applyTheme(next);return}
  if(document.startViewTransition){
    const vt=document.startViewTransition(()=>applyTheme(next));
    vt.ready.then(()=>document.documentElement.animate({clipPath:clip},{duration:560,easing:"cubic-bezier(.45,0,.2,1)",pseudoElement:"::view-transition-new(root)"})).catch(()=>{});
    return;
  }
  const w=document.createElement("div"); w.className="wipe"; w.style.background=BG[next];
  document.body.appendChild(w);
  const an=w.animate({clipPath:clip},{duration:460,easing:"cubic-bezier(.45,0,.2,1)",fill:"forwards"});
  an.onfinish=()=>{applyTheme(next);w.animate({opacity:[1,0]},{duration:180,fill:"forwards"}).onfinish=()=>w.remove()};
}
applyTheme(curTheme());
render();
</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}</script>
